name = "lppl-market-context"
main = "src/index.js"
compatibility_date = "2026-11-07"

[vars]
ALLOWED_ORIGIN = "https://careypang.github.io"
MARKET_CONTEXT_SOURCE_URL = "https://raw.githubusercontent.com/CareyPang/LPPL/main/web/mock/data/market/market_latest.json"

[[durable_objects.bindings]]
