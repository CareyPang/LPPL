[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-point-research"
version = "0.1.0"
description = "临界点 2.0 研究层：A 股 LPPLS 顶部 / 多条件底部的数据、拟合、验证"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=14",
  "akshare>=1.12,<1.20.44",
  "baostock>=0.8.9",
  "cma>=3.3",
  "requests>=2.31",
  "pypinyin>=0.49",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "tabulate>=0.9",
  "exchange-calendars==4.13.3",
  "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["research*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests that require outbound network access",
  "e2e: browser smoke tests that require the local site server",
]
