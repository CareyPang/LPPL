<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lightweight Charts 对照页</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202938;font:14px/1.5 system-ui,sans-serif}
    header{padding:16px 22px;background:#fff;border-bottom:1px solid #dfe4ec}h1{margin:0;font-size:20px}
    main{max-width:1500px;margin:0 auto;padding:16px}.controls,.charts{display:flex;gap:12px;align-items:center}
    .controls{flex-wrap:wrap;margin-bottom:12px}.controls button{padding:7px 12px;border:1px solid #c9d1df;border-radius:6px;background:#fff;color:#273246}
    .controls button[aria-pressed=true]{border-color:#315cf5;background:#315cf5;color:white}
    .notice{margin:8px 0;padding:8px 11px;background:#fff8e6;color:#73530b;border:1px solid #f1d891;border-radius:6px}
    .notice[hidden]{display:none}
    #source-label{min-height:20px;margin:4px 0 10px;color:#586579}
    .charts{align-items:stretch}.panel{min-width:0;flex:1;background:#fff;border:1px solid #dfe4ec;border-radius:8px;overflow:hidden}
    .panel h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid #e6eaf0}
    .chart{height:520px;width:100%}iframe{display:block;width:100%;height:520px;border:0}
    #readout{min-height:27px;padding:5px 12px;color:#586579;font-variant-numeric:tabular-nums}
    #cluster-note{padding:0 12px 10px;color:#586579}.small{font-size:12px}
    @media(max-width:700px){main{padding:10px}.charts{display:block}.panel{margin-bottom:12px}.chart,iframe{height:420px}header{padding:12px}}
  </style>
</head>
<body>
  <header><h1>旧 Canvas / Lightweight Charts 5.2.1 对照</h1></header>
  <main>
    <div class="controls" aria-label="图表设置">
      <button type="button" data-symbol="sh000001" data-sample="index" aria-pressed="true">上证指数 sh000001</button>
      <button type="button" data-symbol="sh600519" data-sample="stock" aria-pressed="false">贵州茅台 sh600519</button>
      <button type="button" data-symbol="sh601838" data-sample="stock" aria-pressed="false">成都银行 sh601838</button>
      <button type="button" data-symbol="sh000001" data-sample="history" data-frame-date="2025-08-11" aria-pressed="false">上证指数历史帧 2025-08-11</button>
      <span class="small">成交量保留供应商原始单位；簇内占比不是概率。</span>
    </div>
    <div class="controls" id="scales"></div>
    <p id="source-label" class="small" role="status"></p>
    <p class="notice" id="calendar-notice" role="status" hidden></p>
    <div class="charts">
      <section class="panel"><h2>旧版 Canvas · 仅图表</h2><iframe id="old-chart" title="旧版图表"></iframe></section>
      <section class="panel"><h2 id="new-title">新图表</h2><div id="chart" class="chart"></div><div id="readout" aria-live="polite"></div><div id="cluster-note"></div></section>
    </div>
  </main>
  <script src="app/trading-days.js"></script>
  <script src="app/top-clusters.js"></script>
  <script src="app/lppl-data.js"></script>
  <script src="vendor/lppl-lwc/1/lppl-lwc.js"></script>
  <script src="app/lppl-chart.js"></script>
  <script>
    (async function () {
      const scales = ['2-4w','1-3m','3-6m','6-12m','12-24m','2-6y'];
      const scaleNames = ['2–4 周','1–3 月','3–6 月','6–12 月','12–24 月','2–6 年'];
      let selectedScale = '6-12m', chartApi, token = 0;
      const host = document.getElementById('chart');
      const notice = document.getElementById('calendar-notice');
      const sourceLabel = document.getElementById('source-label');
      const oldFrame = document.getElementById('old-chart');
      let active = null;
      chartApi = LPPLChart.mount(host, { readout: document.getElementById('readout'), initialBars: 120 });
      const scaleRoot = document.getElementById('scales');
      scales.forEach((scale, index) => {
        const button = document.createElement('button');
        button.type = 'button'; button.dataset.scale = scale;
        button.textContent = scaleNames[index]; button.setAttribute('aria-pressed', String(scale === selectedScale));
        button.addEventListener('click', () => {
          selectedScale = scale;
          scaleRoot.querySelectorAll('[data-scale]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
          chartApi.setScale(scale); renderNote(active); renderCalendarNotice(active);
        });
        scaleRoot.append(button);
      });
      function renderNote(current) {
        const rows = current ? LPPLChart.bandsFor(current, selectedScale) : [];
        document.getElementById('cluster-note').textContent = rows.length
          ? rows.map(row => {
            const label = row.source === 'scale_window' ? `${selectedScale} 时间窗` : CPTopClusters.label(row);
            const share = CPTopClusters.shareText(row);
            const detail = row.source === 'scale_window' ? '发布区间' : [share, '不是概率'].filter(Boolean).join('；');
            return `${label} ${row.q20_date}–${row.q80_date}${detail ? `（${detail}）` : ''}`;
          }).join(' · ')
          : '当前已发布数据没有该尺度的合格区间；不补造区间。';
      }
      function renderCalendarNotice(current) {
        const bands = current ? LPPLChart.bandsFor(current, selectedScale) : [];
        const lastBarDate = current?.bars?.at(-1)?.date || current?.bars?.at(-1)?.time || '';
        const needed = LPPLChart.needsCalendarCoverage(bands, lastBarDate, current?.future_calendar);
        notice.hidden = !needed;
        notice.textContent = needed
          ? '日历未覆盖：未来区间超出 CPTradingDays 已发布的交易日历覆盖范围；只绘制无 OHLC 的空白槽位。'
          : '';
      }
      async function pageTemplate(name) {
        const response = await fetch(name);
        if (!response.ok) throw new Error(`${name} 加载失败：HTTP ${response.status}`);
        return response.text();
      }
      function cropPage(html, type) {
        const base = new URL('.', location.href).href;
        const cropStyle = type === 'index'
          ? 'html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#fff!important}body *{visibility:hidden!important}#chartwrap,#chartwrap *{visibility:visible!important}#chartwrap{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;margin:0!important;z-index:2147483647!important;background:#fff!important}#chartwrap canvas{display:block!important;width:100%!important;height:100%!important}'
          : 'html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#fff!important}body *{visibility:hidden!important}#market-plot{display:block!important;visibility:visible!important;position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;margin:0!important;z-index:2147483647!important;background:#fff!important}';
        const injection = type === 'index'
          ? '<script>LPPL.load=async function(){return parent.__LPPLCompareIndexData};LPPL.history=async function(){return parent.__LPPLCompareIndexHistory};<\/script>'
          : '<script>LPPL.stock.latest=async function(){return parent.__LPPLCompareStock.latest};LPPL.stock.market=async function(){return parent.__LPPLCompareStock.market};LPPL.stock.history=async function(){return parent.__LPPLCompareStock.history};LPPL.stock.request=async function(){return {status:"comparison-disabled"}};LPPL.stock.status=async function(){return {status:"comparison-disabled"}};LPPL.stock.remote=async function(){return null};history.replaceState=function(){};<\/script>';
        html = html.replace('<head>', `<head><base href="${base}"><style>${cropStyle}</style>`);
        html = html.replace('<script src="app/lppl-data.js"><\/script>',
          `<script src="app/lppl-data.js"><\/script>${injection}`);
        if (type === 'index') {
          html = html.replace(
            "const c0 = qs.get('code') || '上证指数', d0 = qs.get('asof') || '';",
            "const c0 = 'sh000001', d0 = '';",
          );
        }
        return html;
      }
      async function showLegacyIndex(data, history) {
        window.__LPPLCompareIndexData = data;
        window.__LPPLCompareIndexHistory = history;
        oldFrame.title = '旧版上证指数 Canvas 图表';
        oldFrame.srcdoc = await cropPage(await pageTemplate('index.html'), 'index');
      }
      async function showLegacyStock(code, latest, market, history) {
        window.__LPPLCompareStock = { latest, market, history };
        oldFrame.title = `旧版 ${code} Canvas 图表`;
        oldFrame.onload = () => {
          const doc = oldFrame.contentDocument;
          const input = doc?.getElementById('code');
          const form = input?.form;
          if (input && form) {
            input.value = code;
            form.requestSubmit();
          }
        };
        oldFrame.srcdoc = await cropPage(await pageTemplate('stock.html'), 'stock');
      }
      function historyView(data, frame, history) {
        const bars = data.bars.filter(bar => bar.date <= frame.asof);
        const top = { ...data.top, scale_clusters: frame.clusters };
        const raw = { ...data.raw, asof: frame.asof, top,
          future_calendar: history.future_calendar || data.raw?.future_calendar };
        return { ...data, asof: frame.asof, latest: false, bars, T: bars.length - 1, top, raw };
      }
      async function load(symbol, sample, frameDate) {
        const request = ++token;
        notice.hidden = true;
        notice.textContent = '';
        sourceLabel.textContent = '';
        document.getElementById('new-title').textContent = frameDate
          ? `${symbol} 历史帧 ${frameDate}` : symbol;
        try {
          let current;
          if (sample === 'index' || sample === 'history') {
            const [published, history] = await Promise.all([
              LPPL.load('sh000001'),
              sample === 'history' ? LPPL.history('sh000001') : Promise.resolve(null),
            ]);
            if (request !== token) return;
            let result = published;
            if (frameDate) {
              const frame = history?.frames?.find(item => item.asof === frameDate);
              if (!frame) throw new Error(`已发布历史帧 ${frameDate} 不存在`);
              result = historyView(published, frame, history);
            }
            current = {
              top: result.top || {}, bars: result.bars, asof: result.asof,
              future_calendar: result.raw?.future_calendar,
            };
            await showLegacyIndex(result, history);
            sourceLabel.textContent = `已发布指数日线 ${result.asof}；旧、新图表使用同一适配器载荷。`;
          } else {
            const code = symbol.slice(2);
            const [latest, market] = await Promise.all([
              LPPL.stock.latest(code), LPPL.stock.market(code),
            ]);
            if (request !== token) return;
            if (!Array.isArray(market?.price)) throw new Error('行情接口未返回 K 线；不以模型价格替代实时行情。');
            let futureCalendar = latest?.future_calendar || latest?.raw?.future_calendar || null;
            const lastBarDate = market.price.at(-1)?.date;
            if (!futureCalendar && scales.some(scale => LPPLChart.needsCalendarCoverage(
              LPPLChart.bandsFor(latest || {}, scale), lastBarDate, null,
            ))) {
              const calendarData = await LPPL.history('sh000001').catch(() => null);
              if (request !== token) return;
              futureCalendar = calendarData?.future_calendar || null;
            }
            const stockResult = latest && futureCalendar
              ? { ...latest, future_calendar: futureCalendar } : latest;
            current = { top: latest?.top || {}, bars: market.price, asof: latest?.asof,
              future_calendar: futureCalendar };
            await showLegacyStock(code, stockResult, market, null);
            sourceLabel.textContent = `行情截至 ${market.asof || '—'} · 未复权 · ${market.source || '日线数据'}；模型截至 ${latest?.asof || '—'}（新图表截止线）。`;
          }
          if (request !== token) return;
          if (sample === 'stock' && symbol === 'sh600519') {
            const events = await LPPL.fetchResult('events/events_latest.json');
            if (events.data) {
              const code = '600519';
              current.events = ['lift','dividend','forecast'].flatMap(type =>
                (events.data[type] || []).filter(row => row.code === code).map(row => ({
                  date: row.free_date || row.ex_dividend_date || row.notice_date,
                  label: type === 'lift' ? '解禁' : type === 'dividend' ? '除权' : '预告',
              })));
            }
          }
          if (request !== token) return;
          active = current;
          chartApi.setScale(selectedScale);
          chartApi.setData(current);
          renderNote(current);
          renderCalendarNotice(current);
        } catch (error) {
          if (request === token) {
            notice.hidden = false;
            notice.textContent = '数据读取失败：' + error.message;
          }
        }
      }
      document.querySelectorAll('[data-sample]').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('[data-sample]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        load(button.dataset.symbol, button.dataset.sample, button.dataset.frameDate || '');
      }));
      load('sh000001', 'index', '');
    })();
  </script>
</body>
</html>
