<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">区分历史补算与真实发布证据</title>
  <desc id="desc">证据结构概念图，不代表每个结果已具备全部记录。历史补算使用过去截止日的数据，在之后重新计算。计算完成、封存、指定受众可读、本机呈现和修订是不同记录；封存不是公开首次可见，未知时点不能回填。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#f0f4fa"/></linearGradient><linearGradient id="wash" x2="1"><stop stop-color="#e7effc"/><stop offset="1" stop-color="#f6f9fe"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#8ca4c5" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
    <text x="56" y="54" fill="#1f5fd6" font-size="13" font-weight="600" letter-spacing="2">03 / FOLLOW THE EVIDENCE</text>
    <text x="56" y="105" fill="#17202f" font-size="32" font-weight="600">一份结果，需要几种时间证据。</text>
    <rect x="890" y="39" width="254" height="33" rx="16.5" fill="#fff" stroke="#d5dfed"/>
    <text x="1017" y="61" text-anchor="middle" fill="#59687d" font-size="13">概念示意 · 非具体结果的发布记录</text>

    <rect x="56" y="147" width="1088" height="194" rx="20" fill="#fff" stroke="#dbe3ef"/>
    <rect x="80" y="170" width="106" height="29" rx="14.5" fill="#edf3fd"/><text x="133" y="190" text-anchor="middle" fill="#28559a" font-size="13" font-weight="600">历史补算</text>
    <text x="80" y="229" fill="#17202f" font-size="21" font-weight="550">使用过去的数据，</text><text x="80" y="260" fill="#17202f" font-size="21" font-weight="550">在后来重新计算。</text>
    <rect x="363" y="190" width="246" height="88" rx="12" fill="url(#wash)"/>
    <path d="M382 263l23-22 22 8 24-27 22 7 23-18 22 6 23-13 23 10 24-11" fill="none" stroke="#7199d3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="486" y="303" text-anchor="middle" fill="#59728f" font-size="15">数据只取到研究截止日</text>
    <path d="M635 233h101" fill="none" stroke="#8ca4c5" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="685" y="209" text-anchor="middle" fill="#75869e" font-size="13">之后</text>
    <rect x="764" y="190" width="326" height="88" rx="12" fill="#f6f8fc" stroke="#dfe6ef"/>
    <text x="927" y="226" text-anchor="middle" fill="#435875" font-size="20" font-weight="550">事后重新计算</text>
    <text x="927" y="252" text-anchor="middle" fill="#6d7f98" font-size="14">得到这个截止日的补算结果</text>
    <text x="927" y="303" text-anchor="middle" fill="#59728f" font-size="15">不能据此证明当时已经发布</text>

    <rect x="56" y="361" width="1088" height="200" rx="20" fill="#fff" stroke="#dbe3ef"/>
    <rect x="80" y="385" width="106" height="29" rx="14.5" fill="#fcf5e5"/><text x="133" y="405" text-anchor="middle" fill="#8d7037" font-size="13" font-weight="600">发布证据</text>
    <text x="208" y="405" fill="#43546b" font-size="17">每一种记录分别留证，不能互相代替。</text>
    <path d="M152 455H1046" fill="none" stroke="#d4dfef" stroke-width="2"/>
    <g>
      <circle cx="152" cy="455" r="10" fill="#fff" stroke="#7893b6" stroke-width="2"/><circle cx="152" cy="455" r="3" fill="#7893b6"/>
      <circle cx="376" cy="455" r="10" fill="#fff" stroke="#7893b6" stroke-width="2"/><circle cx="376" cy="455" r="3" fill="#7893b6"/>
      <circle cx="600" cy="455" r="17" fill="#edf3fd"/><circle cx="600" cy="455" r="10" fill="#fff" stroke="#1f5fd6" stroke-width="2.3"/><circle cx="600" cy="455" r="3.4" fill="#1f5fd6"/>
      <circle cx="824" cy="455" r="10" fill="#fff" stroke="#7893b6" stroke-width="2"/><circle cx="824" cy="455" r="3" fill="#7893b6"/>
      <circle cx="1046" cy="455" r="10" fill="#fff" stroke="#aa8a4e" stroke-width="2"/><circle cx="1046" cy="455" r="3" fill="#aa8a4e"/>
    </g>
    <g text-anchor="middle" font-size="18" font-weight="550" fill="#3d526f"><text x="152" y="495">计算完成</text><text x="376" y="495">结果封存</text><text x="600" y="495" fill="#1f5fd6">指定受众可读</text><text x="824" y="495">本机实际呈现</text><text x="1046" y="495">后续修订</text></g>
    <g text-anchor="middle" font-size="13" fill="#74839a"><text x="152" y="521">结果何时算出</text><text x="376" y="521">版本何时保存</text><text x="600" y="521">需要独立的可读证据</text><text x="824" y="521">不等于公开首次发布</text><text x="1046" y="521">保留旧版本</text></g>
    <rect x="56" y="587" width="1088" height="48" rx="10" fill="#f1f5fb" stroke="#dce5f0"/>
    <text x="82" y="617" fill="#3d526f" font-size="17" font-weight="550">封存 ≠ 公开可见</text>
    <path d="M293 600v22" stroke="#cad7e9"/>
    <text x="320" y="617" fill="#5c6f89" font-size="15">首次可见未知时保留未知，不按补算截止日回填。</text>
    <text x="1115" y="617" text-anchor="end" fill="#7c899c" font-size="12">记录缺失应明确说明</text>
  </g>
</svg>
