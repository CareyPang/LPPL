      <text x="896" y="472" text-anchor="middle" fill="#6c7e98" font-size="15">这里只画时间带，不画未来价格。</text>
      <rect x="98" y="180" width="122" height="30" rx="15" fill="#f0f4fa"/>
      <text x="159" y="201" text-anchor="middle" fill="#59687d" font-size="14">已获得的日线</text>
    </g>
    <path d="M98 509H1102" stroke="#aebed1" stroke-width="1.5"/>
    <text x="98" y="536" fill="#65748a" font-size="14">过去</text>
    <rect x="638" y="518" width="144" height="27" rx="13.5" fill="#eaf0f9"/>
    <text x="710" y="537" text-anchor="middle" fill="#34577e" font-size="14" font-weight="600">分析截止线</text>
    <text x="1102" y="536" text-anchor="end" fill="#65748a" font-size="14">未来日期槽</text>
    <g fill="#fff" stroke="#dce4ef"><rect x="56" y="586" width="344" height="49" rx="10"/><rect x="428" y="586" width="344" height="49" rx="10"/><rect x="800" y="586" width="344" height="49" rx="10"/></g>
    <g font-size="15"><text x="77" y="616" fill="#8b713e">1</text><text x="104" y="616" fill="#43546b">核对行情截止与分析截止</text><text x="449" y="616" fill="#8b713e">2</text><text x="476" y="616" fill="#43546b">分别查看主候选与次级候选</text><text x="821" y="616" fill="#8b713e">3</text><text x="848" y="616" fill="#43546b">支持占比不等于见顶概率</text></g>
  </g>
</svg>
