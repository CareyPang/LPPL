<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>完整图表 · Open Design</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #172033; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .chart-page { width: min(1440px, 100%); margin: 0 auto; container-type: inline-size; }
    .chart-content { padding: 24px clamp(14px, 3vw, 36px) 52px; }
    .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin: 4px 0 18px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); line-height: 1.2; }
    .eyebrow { margin: 0 0 6px; color: #60708b; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .asset-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-top: 9px; color: #536078; font-size: 14px; }
    .asset-code { font-variant-numeric: tabular-nums; color: #31415e; }
    .date-line { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; color: #63718a; font-size: 13px; }
    .asof-tag { display: inline-flex; border-radius: 999px; padding: 5px 9px; color: #8a4b0b; background: #fff2cc; font-size: 12px; font-weight: 650; }
    .asof-tag[hidden] { display: none; }
    .header-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .header-links a, .scale-button, .retry-button, .interval-row {
      min-height: 44px; border-radius: 9px; font: inherit;
    }
    .header-links a { display: inline-flex; align-items: center; padding: 0 13px; border: 1px solid #d3dae6; color: #315cf5; background: #fff; text-decoration: none; font-size: 14px; font-weight: 650; }
    .header-links a:hover, .header-links a:focus-visible { border-color: #315cf5; outline: 3px solid rgba(49,92,245,.16); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: start; gap: 16px; }
    .chart-card, .evidence-card, .meta-card, .error-panel { min-width: 0; background: #fff; border: 1px solid #e0e5ed; border-radius: 14px; box-shadow: 0 5px 18px rgba(23,32,51,.045); }
    .chart-card { padding: 16px; }
    .scale-selector { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; }
    .scale-button { flex: 0 0 auto; padding: 0 13px; border: 1px solid #d9dfeb; color: #52617a; background: #fff; font-size: 14px; cursor: pointer; }
    .scale-button[aria-pressed="true"] { color: #fff; border-color: #315cf5; background: #315cf5; }
    .scale-button:focus-visible, .interval-row:focus-visible, .retry-button:focus-visible { outline: 3px solid rgba(49,92,245,.22); outline-offset: 2px; }
    .chart-host { height: 520px; min-width: 0; position: relative; }
    .loading { color: #73809a; font-size: 14px; padding: 12px 2px 0; }
    .calendar-notice { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; color: #92400e; background: #fff7e7; font-size: 13px; }
    .calendar-notice[hidden], .error-panel[hidden], .loading[hidden], #index-replay[hidden], #latest-results-link[hidden] { display: none; }
    .evidence-card, .meta-card { padding: 16px; }
    .evidence-card h2, .meta-card h2 { margin: 0 0 12px; font-size: 17px; }
    .evidence-state { margin: 0 0 10px; color: #33425d; font-size: 14px; font-weight: 650; }
    .evidence-help { display: inline-block; margin: 0 0 10px; color: #315cf5; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
    .interval-list { display: grid; gap: 8px; }
    .interval-row { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 10px; border: 1px solid #dce3f0; background: #fff; text-align: left; color: #26334c; cursor: pointer; }
    .interval-row[aria-pressed="true"] { border-color: #315cf5; background: #eff3ff; }
    .interval-row strong { font-size: 13px; }
    .interval-row span { font-size: 12px; font-variant-numeric: tabular-nums; color: #42516c; }
    .interval-row small { grid-column: 1 / -1; color: #68758d; font-size: 11px; }
    .evidence-note { margin: 10px 0 0; color: #758199; font-size: 12px; line-height: 1.55; }
    .meta-card { margin-top: 12px; }
    .meta-card dl { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 9px 10px; margin: 0; font-size: 13px; }
    .meta-card dt { color: #748099; }
    .meta-card dd { min-width: 0; margin: 0; color: #33425d; overflow-wrap: anywhere; }
    .error-panel { margin: 12px 0; padding: 14px; border-color: #f2c8c8; color: #812a2a; background: #fff7f7; }
    .error-panel p { margin: 0 0 10px; }
    .retry-button { padding: 0 16px; border: 0; color: #fff; background: #315cf5; font-weight: 650; cursor: pointer; }
    .retry-button:hover { background: #2447c9; }
    .latest-results-link { display: inline-block; margin-left: 12px; color: #315cf5; font-size: 14px; }
    .context-foot { margin: 14px 2px 0; color: #7a879d; font-size: 12px; }
    @container (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .evidence-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
      .meta-card { margin-top: 0; }
    }
    @container (max-width: 600px) {
      .chart-content { padding: 16px 12px 38px; }
      .page-heading { display: block; }
      .header-links { justify-content: flex-start; margin-top: 14px; }
      .header-links a { padding-inline: 10px; }
      .chart-card { padding: 10px; border-radius: 11px; }
      .chart-host { height: 380px; }
      .scale-selector { gap: 6px; }
      .scale-button { padding: 0 10px; }
      .evidence-side { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 520px) {
      .odn .odn-l1 { padding-inline: 10px; }
      .odn .odn-brand { min-height: 44px; }
      .odn .odn-r { flex: 1 1 auto; min-width: 0; margin-left: 0; gap: 4px; padding-left: 0; }
      .odn .odn-q { flex: 1 1 auto; min-width: 0; }
      .odn .odn-q input, .odn .odn-q input:focus { width: 100%; min-width: 0; height: 44px; padding-right: 8px; }
      .odn .ai-btn { width: 44px !important; height: 44px !important; min-width: 44px !important; min-height: 44px !important; }
      .odn .odn-star { width: 44px; min-width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
      .odn .odn-menu summary { width: 44px; min-width: 44px; height: 44px; min-height: 44px; padding: 0; }
      .odn .odn-help { display: none; }
      .odn .odn-pop a { display: flex; align-items: center; min-height: 44px; }
      #tv-attr-logo { display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
    }
  </style>
  <script src="app/lppl-data.js"></script>
  <script src="app/trading-days.js"></script>
  <script src="app/top-clusters.js"></script>
  <script src="app/chart-page-core.js"></script>
  <script src="vendor/lppl-lwc/1/lppl-lwc.js"></script>
  <script src="app/lppl-chart.js"></script>
</head>
<body>
  <script src="app/od-nav.js" data-section="terminal"></script>
  <main id="chart-page" class="chart-page" data-ai-context="完整图表">
    <div class="chart-content">
      <header class="page-heading">
      <div>
        <p class="eyebrow">研究图表 · 完整视图</p>
        <h1 id="asset-name">加载中…</h1>
        <div class="asset-line">
          <span id="asset-code" class="asset-code"></span>
          <span id="asset-exchange"></span>
        </div>
        <div class="date-line">
          <span id="market-date"></span>
          <span id="model-date">模型日期 —</span>
          <span id="asof-tag" class="asof-tag" hidden></span>
        </div>
      </div>
      <nav class="header-links" aria-label="图表链接">
        <a id="return-link" href="stock.html">返回标的</a>
        <a id="index-replay" href="index.html">在图表页打开（含历史回放）</a>
      </nav>
      </header>

      <p id="asof-notice" class="calendar-notice" role="status" hidden></p>

      <section id="error-panel" class="error-panel" role="alert" hidden>
        <p id="error-message"></p>
        <button id="retry-button" class="retry-button" type="button" hidden>重试加载</button>
        <a id="latest-results-link" class="latest-results-link" href="" hidden>改看最新结果</a>
      </section>

      <div class="layout">
        <section class="chart-card" aria-label="价格图表">
          <div id="scale-selector" class="scale-selector" role="group" aria-label="时间尺度"></div>
          <div id="chart-host" class="chart-host"></div>
          <div id="loading" class="loading" role="status">正在加载标的与图表数据…</div>
          <p id="calendar-notice" class="calendar-notice" role="status" hidden>日历未覆盖：未来区间超出已发布交易日历范围。</p>
        </section>

        <aside class="evidence-side">
          <section class="evidence-card" aria-labelledby="evidence-title">
            <h2 id="evidence-title">区间与证据</h2>
            <p id="evidence-state" class="evidence-state">等待数据</p>
            <a class="evidence-help" href="backtest.html#view=bench">证据等级是什么？</a>
            <div id="interval-list" class="interval-list"></div>
            <p id="evidence-note" class="evidence-note"></p>
          </section>
          <section class="meta-card" aria-labelledby="meta-title">
            <h2 id="meta-title">数据说明</h2>
            <dl>
              <dt>数据来源</dt><dd id="data-source">未记录</dd>
              <dt>模型版本</dt><dd id="model-version">未记录</dd>
              <dt>Prediction ID</dt><dd id="prediction-id">未记录</dd>
            </dl>
          </section>
        </aside>
      </div>
      <p class="context-foot">时间区间为研究结果，不构成概率或投资建议；行情日期与模型日期分开标示。</p>
    </div>
  </main>
  <script src="app/ai-assistant.js" data-page="stock" data-default="closed"></script>
  <script src="app/chart-page.js"></script>
</body>
</html>
