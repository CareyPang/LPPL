const scales=['2-4w','1-3m','3-6m','6-12m','12-24m','2-6y'], scaleName={'2-4w':'2–4 周','1-3m':'1–3 月','3-6m':'3–6 月','6-12m':'6–12 月','12-24m':'12–24 月','2-6y':'2–6 年'};
function drawdownHtml(dp){if(dp?.evidence!=='descriptive')return `<p>${esc(evLabel(dp?.evidence))}：不显示数值。</p>`;const all=dp.table?.all||{},n=dp.n??all.n;if(n==null)return '<p>描述性结果缺少样本数，暂不显示数值。</p>';const rows=[['顶后最大回撤',all.max_dd],['顶后回撤时间（交易日）',all.days_to_trough],['120 日内回撤',all.dd120]].filter(x=>x[1]);return `<div class="scroll"><table class="table"><thead><tr><th>描述性指标（n=${n}）</th><th>20 分位</th><th>中位数</th><th>80 分位</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${k.includes('时间')?nfmt(v.q20):pct(v.q20)}</td><td>${k.includes('时间')?nfmt(v.q50):pct(v.q50)}</td><td>${k.includes('时间')?nfmt(v.q80):pct(v.q80)}</td></tr>`).join('')}</tbody></table></div><p class="disclaimer">n=${n}；历史分位，不是预测。此处不提供目标价。</p>`}
function riskHtml(d){const t=d.top||{},w=t.window||{},lc=t.lppls_confidence||{},ind=t.indicators||{},dp=t.drawdown_price||{},status={signal:'有合格拟合',no_qualified_fit:'没有合格拟合',t1_not_qualified:'起点未达条件',not_computed:'未计算'}[t.signal_status]||t.signal_status||'—';const rows=scales.map(k=>{const x=ind[k]||{},e=lc.scale_evidence?.[k]||x.evidence||lc.evidence,show=!hiddenEv(e);return `<tr><td>${scaleName[k]}</td><td>${show?nfmt(x.n_windows):'—'}</td><td>${show?nfmt(x.n_qualified_standard):'—'}</td><td>${esc(x.signal_status||'—')}</td><td>${esc(evLabel(e))}</td></tr>`}).join('');let range='当前没有可显示的风险窗口。';if(w.start&&w.end&&!hiddenEv(w.evidence||lc.evidence))range=`<p class="range">风险窗口：${esc(w.start)} – ${esc(w.end)}（未校准，仅供参考）</p>`;const scenarios=(t.scenarios||[]).filter(s=>s.q20_date&&s.q80_date&&!hiddenEv(s.evidence||lc.scale_evidence?.[s.scale]||lc.evidence));const scenarioText=scenarios.map(s=>`<p class="range">${esc(scaleName[s.scale]||s.scale||'情景')}：${esc(s.q20_date)} – ${esc(s.q80_date)}（未校准，仅供参考）</p>`).join('');return `<p>状态：${esc(status)}。个股开发段结果不代表预测。</p>${range}${scenarioText}<div class="scroll"><table class="table"><thead><tr><th>尺度</th><th>窗口数</th><th>合格拟合数</th><th>状态</th><th>证据</th></tr></thead><tbody>${rows}</tbody></table></div><p class="disclaimer">无证据、失败或仅开发段结果不显示数值；风险时间只按区间展示。</p><h3>历史回撤分布</h3>${drawdownHtml(dp)}`}
function drawHistory(d,h){const c=$('plot'),g=c.getContext('2d'),ph=d.price_history||{},dates=ph.dates||[],cl=ph.close||[],frames=h?.frames||[],hidden=hiddenEv(h?.evidence||h?.evidence_levels?.scenarios||'dev_only');const w=c.clientWidth,hh=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=hh*dpr;g.scale(dpr,dpr);g.clearRect(0,0,w,hh);if(dates.length<2){$('history-note').textContent='暂无可绘制的后复权历史数据。';return}const x=s=>(Date.parse(s)-Date.parse(dates[0]))/(Date.parse(dates.at(-1))-Date.parse(dates[0])||1)*(w-12)+6,lo=Math.min(...cl),hi=Math.max(...cl),y=v=>hh-8-(v-lo)/(hi-lo||1)*(hh-16);g.strokeStyle='#2A2A2A';for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,hh*i/4);g.lineTo(w,hh*i/4);g.stroke()}if(!hidden)for(const f of frames)for(const s of f.scenarios||[]){if(!s.q20_date||!s.q80_date)continue;const left=f.asof<s.q20_date?s.q20_date:f.asof;g.fillStyle='rgba(255,184,0,.12)';g.fillRect(x(left),4,Math.max(1,x(s.q80_date)-x(left)),8)}g.strokeStyle='#AAAAAA';g.beginPath();cl.forEach((v,i)=>i?g.lineTo(x(dates[i]),y(v)):g.moveTo(x(dates[i]),y(v)));g.stroke();$('history-note').textContent=h?`${h.evidence==='descriptive'?`n=${frames.length}；历史分位，不是预测。`:'历史回测结果已加载。'}${hidden?' 情景数值按证据规则隐藏。':' 情景带仅作未校准参考。'}`:'本次数据未附历史回测文件；当前结果中的后复权收盘序列仍供回看。';}

function hitRows(d){return ['fh60','fh120'].map(k=>{const x=d.first_hit?.[k]||{},[term,bounds]=k==='fh60'?['60 日','+15% / −15%']:['120 日','+30% / −20%'];return ['hist','rw'].map(t=>{const v=x[t];return `<tr><td>${term}</td><td>${bounds}</td><td>${t==='hist'?'历史类似事件':'随机波动对照'}</td><td>${dipPct(v?.U)}</td><td>${dipPct(v?.L)}</td><td>${dipPct(v?.none)}</td><td>${t==='hist'?dnum(v?.n):'模拟 20000 条'}</td></tr>`}).join('')}).join('')}
async function renderDip(d){const host=$('dip-panel');if(!d){host.innerHTML='<p class="muted">暂无抄底面板结果。</p><p class="dip-disclaimer">历史分位，不是预测。</p>';return}const s=d.state||{},lib=d.lib||{},f=d.similar?.full||{},q=f.q||{},badge=lib.smoke?'<span class="badge">临时事件库（223 只）</span>':'',pending=d.oos==='pending'?'<span class="badge">样本外检验进行中</span>':'';const structure=`从 ${s.peak_date||'—'} 的高点（此前上涨 ${dipPct(s.runup)}）已下跌 ${dipPct(s.dd)}，历时 ${dnum(s.td_since_peak)} 个交易日；最近低点在 ${s.low_date||'—'}，之后反弹 ${dipPct(s.bounce_from_low)}。`;const depth=d.depth_bucket==null?'—':dipPct(Math.abs(Number(d.depth_bucket)));const rule=d.in_structure===true?`符合‘大涨后深跌’条件，下面按跌幅 ≥${depth} 的历史事件对照。`:'不符合‘大涨后深跌’条件（要求此前涨 ≥200%、跌 ≥40%、距高点 ≤250 个交易日），下面不做相似事件对照。';const sr=`全市场 ${dnum(f.n)} 个类似事件中，120 个交易日后收益中位数 ${dipPct(q.r120?.[2])}，一半落在 ${dipPct(q.r120?.[1])} 到 ${dipPct(q.r120?.[3])} 之间；期间最深再跌中位数 ${dipPct(q.mdd120?.[2])}；120 日内最高反弹达到 30% 的占 ${dipPct(f.p_up120_ge30)}。`;const h=d.first_hit||{},hr=`历史上类似情况，60 个交易日内先涨 15% 的占 ${dipPct(h.fh60?.hist?.U)}，先跌 15% 的占 ${dipPct(h.fh60?.hist?.L)}；如果股价只是随机波动（波动率按当前水平），这两个数是 ${dipPct(h.fh60?.rw?.U)} 和 ${dipPct(h.fh60?.rw?.L)}。`;const r=d.regime||{},rr=`按周收益估计，现在处于高波动阶段的概率是 ${dipPct(r.p_hi_filtered)}（高波动阶段年化波动 ${dipPct(r.hi_vol_ann)}，低波动阶段 ${dipPct(r.lo_vol_ann)}）。`;const env=await LPPL.stock.dipEnv();const names={510300:'沪深300 ETF',588000:'科创50 ETF',510050:'上证50 ETF',510500:'中证500 ETF'},shares=env?.shares||{},opts=env?.options||{};const shareHtml=env?Object.keys(names).map(code=>{const x=shares[code]||{},days=(x.mad_subscription_dates||[]).slice(-3).map(v=>`<li>${esc(v.date)}：${dipSigned(v.change==null?null:Number(v.change)/1e4)} 亿份，偏离常态 ${dipFix(v.robust_z,1)} 倍</li>`).join('')||'<li>—</li>';return `<div class="env-item"><b>${names[code]}</b><p>近 20 个交易日份额 ${dipSigned(x.change_20d_shares_yi)} 亿份（${dipSigned(dipPctChange(x.change_20d),1)}%）。</p>${values([['最新总份额',`${dipFix(x.latest_shares_yi)} 亿份`],['5日份额变化',dipShareChange(x,5)],['20日份额变化',dipShareChange(x,20)],['60日份额变化',dipShareChange(x,60)]])}<small>样本 ${dnum(x.n_days)} 日；最新日 ${esc(x.latest_date||'—')}；20日分母日 ${esc(x.change_20d_from||'—')}</small><p class="dip-label">单日申购明显偏大的日子（最近 3 次）</p><ul class="anomalies">${days}</ul></div>`}).join(''):'<p class="muted">暂无</p>';const optionHtml=env?Object.keys(names).map(code=>{const x=opts[code]||{};return `<div class="env-item"><b>${names[code]}</b>${values([['隐含波动率（平值）',dipPct(x.iv_atm)],['隐含波动 − 近 20 日实际波动',dipPct(x.iv_minus_rv20)],['认沽比认购贵（偏度）',dipPct(x.put_call_skew)],['认沽/认购成交量比',dipFix(x.put_call_volume,2)],['隐含波动在历史中的位置',`${dipPct(x.iv_pct_rv_history)} 分位`]])}<small>样本 ${dnum(x.n)} 个期权合约；${esc(x.error||'指数/ETF 环境，非个股期权')}</small></div>`}).join(''):'<p class="muted">暂无</p>';host.innerHTML=`<p>只描述历史上类似情况后来怎样，不是预测，也不构成投资建议。</p>${badge}${pending}<p class="disclaimer">事件库 ${esc(lib.version||'—')} · 数据截至 ${esc(lib.cutoff||'—')} · 共 ${dnum(lib.n_events)} 个事件</p><div class="dip-grid"><section class="dip-card"><h3>现在跌到哪了？</h3><p>${structure}<br>${rule}</p>${values([['截止日期',s.asof||'—'],['收盘价（后复权）',s.close==null?'—':`${dipFix(s.close)}（后复权）`],['是否符合条件',d.in_structure===true?'是':d.in_structure===false?'否':'—'],['对照档',d.depth_bucket==null?'—':`跌幅 ≥${depth}`],['前高日期',s.peak_date||'—'],['高点前涨幅',dipPct(s.runup)],['距高点跌幅',dipPct(s.dd)],['距高点交易日',dnum(s.td_since_peak)],['低点日期',s.low_date||'—'],['距最近低点反弹',dipPct(s.bounce_from_low)],['20日收益',dipPct(s.ret20)],['60日收益',dipPct(s.ret60)],['近 20 日波动（年化）',dipPct(s.rv20)],['波动在近 5 年中的位置',`${dipPct(s.rv20_pct5y)} 分位`],['日波动估计',dipPct(s.vol_d)],['距下方成交密集区',s.well_dist_below==null?'下方没有成交密集区':dipPct(s.well_dist_below)]])}<p class="dip-disclaimer">基于最近 500 个交易日。历史分位，不是预测。</p></section><section class="dip-card"><h3>历史上类似的股票，后来怎样？</h3><p>${sr}</p>${similarPools(d.similar||{})}<p class="dip-disclaimer">‘最高反弹’按事后最高点计算，实际很难恰好卖在最高点，所以要和‘120日后收益’一起看。历史分位，不是预测。</p></section><section class="dip-card"><h3>先涨还是先跌？</h3><p>${hr}</p><div class="scroll"><table class="table"><thead><tr><th>期限</th><th>上沿/下沿</th><th>来源</th><th>先碰上沿</th><th>先碰下沿</th><th>都没碰到</th><th>样本数</th></tr></thead><tbody>${hitRows(d)}</tbody></table></div><p class="dip-disclaimer">历史比例高于随机对照，只说明过去类似事件略偏向先反弹；样本外检验完成前，不能当作预测。历史分位，不是预测。</p></section><section class="dip-card"><h3>现在是高波动阶段吗？</h3><p>${rr}</p>${values([['处于高波动阶段的概率',dipPct(r.p_hi_filtered)],['高波动阶段的年化波动',dipPct(r.hi_vol_ann)],['低波动阶段的年化波动',dipPct(r.lo_vol_ann)],['高波动阶段的平均周收益',dipPct(r.hi_mean_wk)],['低波动阶段的平均周收益',dipPct(r.lo_mean_wk)],['使用周数',dnum(r.weeks)]])}<p class="dip-disclaimer">高波动不等于下跌：它只说明价格摆动大。概率只用截至当周的数据计算，不用未来数据。历史分位，不是预测。</p></section><section class="dip-card wide"><h3>大盘资金和情绪怎样？</h3><p class="dip-disclaimer">截至 ${esc(env?.asof||'—')}。</p><h4>宽基 ETF 份额变化（资金申购/赎回代理）</h4><div class="env-grid">${shareHtml}</div><p class="dip-disclaimer">ETF 份额增加只说明有资金申购，不能确定是谁买的。历史分位，不是预测。</p><h4>ETF 期权：市场情绪（指数/ETF 环境，非个股期权）</h4><div class="env-grid">${optionHtml}</div><p class="dip-disclaimer">期权数据反映的是指数情绪，不是这只股票。历史分位，不是预测。</p></section></div>`}
function render(d,h){$('results').hidden=false;$('asof').textContent=d.asof||'—';$('stock-meta').textContent=`${d.name||''} ${d.symbol||''} · 截止 ${d.asof||'—'} · 后端 ${d.data_version||'—'}`;const t=d.top||{};$('risk').innerHTML=riskHtml(d);drawHistory(d,h);renderDip(d.dip)}
let serial=0;
async function query(code,id){const api=LPPL.stock;const queued=await api.request(code),since=queued?.since,ts=Date.parse(since);if(!Number.isFinite(ts))throw Error('查询服务未返回有效任务时间');const start=Date.now(),currentDeadline=start+600000,totalDeadline=start+2400000;let latest=null;while(Date.now()<currentDeadline){latest=await api.remote(code,'latest').catch(()=>null);if(latest&&Date.parse(latest.generated_at)>=ts-60000)break;const st=await api.status(code,since).catch(()=>null);if(st?.status==='completed'&&st.conclusion!=='success')throw Error('当前结果计算失败');$('query-status').textContent='当前结果计算中…';await new Promise(r=>setTimeout(r,10000));if(id!==serial)return}if(!latest||Date.parse(latest.generated_at)<ts-60000)throw Error('当前结果暂未返回，请稍后刷新');render(latest,null);$('query-status').textContent='当前结果已就绪；历史回测后台计算中。';while(Date.now()<totalDeadline&&id===serial){await new Promise(r=>setTimeout(r,10000));const st=await api.status(code,since).catch(()=>null);if(st?.status!=='completed')continue;if(st.conclusion==='success'){const [now,h]=await Promise.all([api.remote(code,'latest'),api.remote(code,'history')]);if(now){render(now,h);$('query-status').textContent='历史回测已更新。';return}}else{$('query-status').textContent='历史回测未能完成；当前结果仍可查看。';return}}$('query-status').textContent='历史回测后台仍在计算；当前结果可先查看。'}
async function loadCode(code){const id=++serial;$('query-status').textContent='读取缓存结果…';try{const d=await LPPL.stock.latest(code);if(id!==serial)return;if(d){render(d,null);$('query-status').textContent='缓存的当前结果已加载；历史回测文件暂不可用。';return}await query(code,id)}catch(e){if(id===serial)$('query-status').textContent=e.message||'数据未加载。'}}
$('search').addEventListener('submit',e=>{e.preventDefault();const c=$('code').value.trim();if(!/^\d{6}$/.test(c)){$('query-status').textContent='请输入六位数字代码。';return}const u=new URL(location.href);u.searchParams.set('code',c);history.replaceState(null,'',u);loadCode(c)});
const initial=new URLSearchParams(location.search).get('code');if(initial&&/^\d{6}$/.test(initial)){$('code').value=initial;loadCode(initial)}
</script>
