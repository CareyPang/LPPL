<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>临界点终端 · 见顶窗口 / 回落区 / 二波</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-nowrap  { white-space: nowrap; }
}
/* OD-LAYOUT-PRIMITIVES v1 end */

/* Trading Terminal 设计系统：近黑底、细边线、直角、等宽数字、无阴影无渐变。
   涨跌色按 A 股习惯：红涨绿跌。琥珀 = 见顶预警，蓝 = 截止日之后的真实走势。 */
:root {
  --bg: #0D0D0D; --surface: #141414; --surface-2: #1A1A1A; --line: #2A2A2A; --grid: #1E1E1E;
  --ink: #FFFFFF; --ink-2: #AAAAAA; --ink-3: #828282;
  --up: #FF4757; --dn: #00D4AA; --warn: #FFB800; --real: #4DA3FF; --bot: #00D4AA; --wave: #E6E6E6;
  --f-m: "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, "Microsoft YaHei UI", monospace;
  --f-u: "Inter", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px;
  --t-fast: 150ms; --t-exit: 100ms;
  --side-w: 344px; --tool-w: 48px;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--f-u); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: var(--ink-2); text-decoration: none; }
.m { font-family: var(--f-m); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .dn { color: var(--dn); } .wn { color: var(--warn); } .rl { color: var(--real); }
:focus-visible { outline: 2px solid var(--real); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- 顶部指令栏 ---------- */
.bar { border-bottom: 1px solid var(--line); background: var(--surface); }
.bar-in { padding: var(--s2) var(--s4); --od-gap: var(--s4); }
.brand { font: 600 15px/1 var(--f-m); letter-spacing: 0.04em; }
.brand small { display: block; font: 500 10px/1 var(--f-u); color: var(--ink-3); letter-spacing: 0.12em; margin-top: var(--s1); }
.cmd { --od-gap: 0; border: 1px solid var(--line); background: var(--bg); max-width: 620px; }
.cmd label { padding: 0 var(--s3); font-size: 12px; color: var(--ink-3); border-right: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
.in { background: transparent; border: 0; padding: var(--s2) var(--s3); min-height: 40px; outline: none; }
.in:focus-visible { outline: 2px solid var(--real); outline-offset: -2px; }
#code { font-family: var(--f-m); }
#asof { border-left: 1px solid var(--line); color-scheme: dark; font-family: var(--f-m); width: 160px; }
.go { min-height: 40px; padding: 0 var(--s4); border: 0; background: var(--warn); color: #0D0D0D; font-weight: 600; cursor: pointer; transition: background var(--t-fast) ease-out; }
.go:hover { background: #FFC933; }
.go:disabled { background: var(--surface-2); color: var(--ink-3); cursor: progress; }
.nav { --od-gap: var(--s4); font-size: 13px; }
.nav a { padding: var(--s2) 0; border-bottom: 1px solid transparent; }
.nav a:hover { color: var(--ink); border-bottom-color: var(--ink-3); }
.err { margin: 0; padding: var(--s2) var(--s4); background: #2A1215; color: #FF8A94; border-bottom: 1px solid #4A1E24; font-size: 13px; }

/* ---------- 行情带 + 快捷回放 ---------- */
.strip { border-bottom: 1px solid var(--line); --od-gap: 0; overflow-x: auto; scrollbar-width: thin; }
.tk { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: var(--s2) var(--s4); border: 0; border-right: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; min-height: 52px; transition: background var(--t-fast) ease-out; }
.tk:hover { background: var(--surface-2); }
.tk[aria-current="true"] { background: var(--surface); box-shadow: inset 0 -2px 0 var(--warn); }
.tk-n { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.tk-v { font: 600 14px/1.2 var(--f-m); white-space: nowrap; }
.tk-v span { font-weight: 400; font-size: 12px; margin-left: var(--s2); }
.strip-k { padding: 0 var(--s3) 0 var(--s4); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; white-space: nowrap; }
.chip { border: 1px solid var(--line); background: transparent; padding: var(--s1) var(--s3); min-height: 32px; font-size: 12px; color: var(--ink-2); cursor: pointer; white-space: nowrap; margin-right: var(--s2); transition: border-color var(--t-fast) ease-out, color var(--t-fast) ease-out; }
.chip:hover { border-color: var(--warn); color: var(--ink); }
.chips { padding: 0 var(--s4) 0 0; --od-gap: 0; }

/* ---------- 主工作区 ---------- */
.app { display: grid; grid-template-columns: var(--tool-w) minmax(0, 1fr) var(--side-w);
  grid-template-areas: "tool head side" "tool chart side" "tool tl side" "bottom bottom bottom"; border-bottom: 1px solid var(--line); }
.tool { grid-area: tool; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; padding: var(--s2) 0; gap: var(--s1); }
.tool hr { width: 24px; border: 0; border-top: 1px solid var(--line); margin: var(--s1) 0; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; --od-icon-size: 18px; transition: background var(--t-fast) ease-out, color var(--t-fast) ease-out; }
.ib:hover { background: var(--surface-2); color: var(--ink); }
.ib[aria-pressed="true"] { color: var(--warn); border-color: var(--line); background: var(--bg); }
.ib:disabled { color: #4A4A4A; cursor: not-allowed; }

.chead { grid-area: head; border-bottom: 1px solid var(--line); padding: var(--s2) var(--s3); --od-gap: var(--s3); min-height: 48px; }
.sym-n { font: 600 16px/1.2 var(--f-u); white-space: nowrap; }
.sym-c { font: 400 12px/1.2 var(--f-m); color: var(--ink-3); white-space: nowrap; }
.mode { font: 600 11px/1 var(--f-u); padding: var(--s1) var(--s2); border: 1px solid var(--real); color: var(--real); letter-spacing: 0.06em; white-space: nowrap; }
.mode.live { border-color: var(--ink-3); color: var(--ink-2); }
.tg { --od-gap: var(--s1); }
.tgb { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink-3); padding: 0 var(--s2); min-height: 28px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: color var(--t-fast) ease-out, border-color var(--t-fast) ease-out; }
.tgb:hover { border-color: var(--ink-3); }
.tgb[aria-pressed="true"] { color: var(--ink); border-color: #3A3A3A; background: var(--surface); }
.tgb i { display: block; width: 12px; height: 8px; flex: none; }
.tgb[aria-pressed="false"] i { opacity: 0.35; }
.sw-top { background: rgba(255, 184, 0, 0.45); }
.sw-bot { border: 1px solid var(--bot); background: rgba(0, 212, 170, 0.18); }
.sw-wave { height: 0 !important; border-top: 2px dashed var(--wave); }
.sw-real { height: 0 !important; border-top: 2px dashed var(--real); }
.sw-act { width: 0 !important; height: 0 !important; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 8px solid var(--up); }
.sw-vol { background: #3A3A3A; }
.sw-conf { background: var(--warn); }

.chart { grid-area: chart; position: relative; height: clamp(400px, 62vh, 760px); background: var(--bg); }
.chart canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: pan-y; }
.chart canvas.grab { cursor: grabbing; }
.chart canvas:focus-visible { outline: 2px solid var(--real); outline-offset: -2px; }
.legend { position: absolute; top: var(--s2); left: var(--s3); pointer-events: none; font: 400 12px/1.6 var(--f-m); color: var(--ink-2); background: rgba(13, 13, 13, 0.78); padding: 2px var(--s2); max-width: calc(100% - 96px); }
.legend b { font-weight: 500; color: var(--ink); }
.legend .lg-k { color: var(--ink-3); margin-left: var(--s2); }
.ld { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(13, 13, 13, 0.62); }
.ld-box { width: min(360px, 80%); background: var(--surface); border: 1px solid var(--line); padding: var(--s4); }
.ld-t { margin: 0 0 var(--s2); font-size: 13px; }
.ld-s { margin: var(--s2) 0 0; font: 400 12px/1.4 var(--f-m); color: var(--ink-3); }
.ld-track { height: 2px; background: var(--line); overflow: hidden; }
.ld-fill { height: 100%; background: var(--warn); transform-origin: left; transform: scaleX(0); transition: transform 120ms linear; }
.ld-skel { color: var(--ink-3); font-size: 13px; }

.tl { grid-area: tl; border-top: 1px solid var(--line); background: var(--surface); padding: var(--s1) var(--s2); --od-gap: var(--s2); min-height: 52px; }
.tl-k { font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-left: var(--s2); }
.tl input[type=range] { accent-color: var(--warn); height: 32px; cursor: pointer; }
.tl output { font: 600 13px/1 var(--f-m); min-width: 96px; text-align: right; }
.tl-b { border: 1px solid var(--line); background: transparent; color: var(--ink-2); min-height: 32px; padding: 0 var(--s3); font-size: 12px; cursor: pointer; white-space: nowrap; }
.tl-b:hover { color: var(--ink); border-color: var(--ink-3); }
.tl .ib { width: 36px; height: 36px; }

/* ---------- 右侧结论栏 ---------- */
.side { grid-area: side; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
.blk { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
.blk-k { margin: 0 0 var(--s2); font: 500 11px/1 var(--f-u); letter-spacing: 0.1em; color: var(--ink-3); }
.px-big { font: 600 28px/1 var(--f-m); white-space: nowrap; }
.px-chg { font: 400 13px/1 var(--f-m); white-space: nowrap; }
.px-sub { margin-top: var(--s1); font-size: 12px; color: var(--ink-3); }
.vh { margin: 0; font: 600 18px/1.35 var(--f-u); }
.vh.t-warn { color: var(--warn); } .vh.t-bot { color: var(--dn); } .vh.t-real { color: var(--real); }
.vs { margin: var(--s1) 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.phs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); }
.phs li { padding: 6px 2px; text-align: center; border-right: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.phs li:last-child { border-right: 0; }
.phs .n { display: block; font: 400 10px/1 var(--f-m); margin-bottom: 2px; }
.phs .past { color: var(--ink-2); }
.phs .on { background: var(--warn); color: #0D0D0D; font-weight: 600; }
.phs .on.ph-base, .phs .on.ph-wave2 { background: var(--dn); }
.ph-tip { margin: var(--s2) 0 0; font-size: 12px; color: var(--ink-2); }
.kv { list-style: none; margin: 0; padding: 0; }
.kv li { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding: 6px 0; border-bottom: 1px solid var(--grid); }
.kv li:last-child { border-bottom: 0; }
.kv .k { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.kv .v { font: 500 13px/1.3 var(--f-m); text-align: right; white-space: nowrap; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); margin-bottom: var(--s3); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink-3); min-height: 36px; font-size: 13px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button[aria-selected="true"] { color: var(--ink); background: var(--bg); box-shadow: inset 0 -2px 0 var(--warn); }
.seg button.s-bot[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--dn); }
.seg button.s-wave[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--wave); }
.pl-lead { margin: 0; font: 600 15px/1.4 var(--f-m); }
.pl-meta { margin: var(--s1) 0 var(--s3); font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.pl-rows { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.pl-rows li { counter-increment: r; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 var(--s2); padding: var(--s2) 0; border-top: 1px solid var(--grid); }
.pl-rows li::before { content: counter(r); font: 400 11px/1.6 var(--f-m); color: var(--ink-3); grid-row: span 2; }
.pl-rows b { font-size: 13px; font-weight: 600; }
.pl-rows span { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.cks { list-style: none; margin: var(--s3) 0 0; padding: 0; border-top: 1px solid var(--line); }
.cks li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--s2); padding: var(--s2) 0; border-bottom: 1px solid var(--grid); }
.ck-s { font: 600 11px/1.6 var(--f-m); color: var(--ink-3); }
.ck-s.ok { color: var(--dn); }
.ck-n { font-size: 13px; }
.ck-n small { margin-left: var(--s2); font-size: 10px; color: var(--warn); border: 1px solid #5A4500; padding: 0 4px; }
.ck-d { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.ck-sum { margin: var(--s2) 0 0; font-size: 13px; }
.cur-d { font: 600 13px/1.2 var(--f-m); }
.cur-l { margin: var(--s1) 0 0; font-size: 12px; color: var(--ink-2); line-height: 1.55; }
.cur-b { margin-top: var(--s2); display: inline-flex; align-items: center; gap: 6px; --od-icon-size: 14px; }
.note { margin: 0; font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.note b { color: var(--real); font-weight: 600; }

/* ---------- 底部面板 ---------- */
.bottom { grid-area: bottom; border-top: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); overflow-x: auto; }
.tabs button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink-3); padding: 0 var(--s4); min-height: 40px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--bg); box-shadow: inset 0 2px 0 var(--warn); }
.tp { padding: var(--s4); }
.tp-d { margin: 0 0 var(--s3); font-size: 13px; color: var(--ink-2); max-width: 75ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--s4); }
.pn { border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.pn-h { margin: 0; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); font: 500 11px/1.4 var(--f-u); letter-spacing: 0.08em; color: var(--ink-3); }
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 500 11px/1.3 var(--f-u); color: var(--ink-3); letter-spacing: 0.04em; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--grid); font-family: var(--f-m); white-space: nowrap; }
tr.jump { cursor: pointer; }
tr.jump:hover td, tr.jump:focus-visible td { background: var(--surface-2); }
td.ok { color: var(--dn); } td.no { color: var(--up); }
td.q { color: var(--dn); }
.kpis { --od-cols: 4; --od-gap: 0; border-bottom: 1px solid var(--line); }
.kpi { padding: var(--s3); border-right: 1px solid var(--line); }
.kpi:last-child { border-right: 0; }
.kpi-k { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.kpi-v { margin-top: var(--s1); font: 600 20px/1.1 var(--f-m); white-space: nowrap; }
.kpi-v small { font-size: 12px; font-weight: 400; color: var(--ink-3); }
.acts { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
.acts li button { width: 100%; display: grid; grid-template-columns: 96px 28px 64px minmax(0, 1fr); align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border: 0; border-bottom: 1px solid var(--grid); background: transparent; text-align: left; cursor: pointer; font-size: 12px; }
.acts li button:hover { background: var(--surface-2); }
.acts .ad, .acts .ap { font-family: var(--f-m); }
.acts .aw { color: var(--ink-2); line-height: 1.4; }
.tag { font: 600 11px/1 var(--f-u); padding: 3px 0; text-align: center; border: 1px solid; }
.tag-b { color: var(--up); border-color: var(--up); }
.tag-s { color: var(--dn); border-color: var(--dn); }
.empty { padding: var(--s4); color: var(--ink-3); font-size: 13px; }
.tape svg { display: block; width: 100%; height: 200px; }
.tp-th { stroke: var(--warn); stroke-dasharray: 4 4; stroke-width: 1; }
.tp-bar { fill: #3A3A3A; } .tp-bar-hot { fill: var(--warn); }
.tp-px { fill: none; stroke: var(--ink-2); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.tp-hit { fill: var(--dn); } .tp-miss { fill: none; stroke: var(--up); stroke-width: 1.5; }
.rm-tick { fill: var(--ink-3); font: 400 11px var(--f-m); }
.rm-now { stroke: var(--ink-2); stroke-dasharray: 3 3; }
.honest { margin: 0; padding: var(--s3); font-size: 13px; color: var(--ink-2); line-height: 1.6; max-width: 90ch; }
.tape-lg { padding: var(--s2) var(--s3); font-size: 12px; color: var(--ink-3); --od-gap: var(--s4); border-bottom: 1px solid var(--line); }
.tape-lg i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

footer { padding: var(--s4); font-size: 12px; color: var(--ink-3); line-height: 1.6; }
footer p { margin: 0; max-width: 110ch; }

/* ---------- 响应式 ---------- */
@media (max-width: 1180px) {
  .app { grid-template-columns: var(--tool-w) minmax(0, 1fr); grid-template-areas: "tool head" "tool chart" "tool tl" "side side" "bottom bottom"; }
  .side { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .side .blk { border-right: 1px solid var(--line); }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 768px) {
  .bar-in { flex-wrap: wrap; }
  .cmd { order: 3; flex-basis: 100%; max-width: none; }
  .cmd label { display: none; }
  #asof { width: 132px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "tool" "chart" "tl" "side" "bottom"; }
  .tool { flex-direction: row; justify-content: flex-start; padding: var(--s1) var(--s2); border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tool hr { width: 0; height: 24px; border-top: 0; border-left: 1px solid var(--line); margin: 0 var(--s1); }
  .ib { width: 44px; height: 44px; }
  .chart { height: 420px; }
  .chead { flex-wrap: wrap; }
  .side { display: flex; }
  .side .blk { border-right: 0; }
  .kpis { --od-cols: 2; }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .tl { flex-wrap: wrap; }
  .tl input[type=range] { flex-basis: 100%; order: 9; }
  .legend { font-size: 11px; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in od-row">
    <div class="brand od-fixed">临界点终端<small>LPPLS · 顶底分离</small></div>
    <div class="cmd od-row od-fill" role="search">
      <label for="code" class="od-fixed">代码</label>
      <input class="in od-fill" id="code" value="上证指数" autocomplete="off" spellcheck="false" aria-describedby="err" />

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const U = CPUI, E = U.esc;

  /* ================= 图标（同一套线性图标：24 网格，1.6 描边，直角端点） ================= */
  const ICON = {
    cross: '<path d="M12 3v18M3 12h18"/>',
    zin: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6M11 8v6"/>',
    zout: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6"/>',
    reset: '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/>',
    all: '<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
    prev: '<path d="M15 6l-6 6 6 6"/>',
    next: '<path d="M9 6l6 6-6 6"/>',
    play: '<path d="M8 5v14l11-7z"/>',
    pause: '<path d="M9 5v14M15 5v14"/>',
    target: '<circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
  };
  const icon = (k) => '<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true">' + ICON[k] + '</svg>';
  [['b-cross', 'cross'], ['b-zin', 'zin'], ['b-zout', 'zout'], ['b-reset', 'reset'], ['b-all', 'all'], ['tl-prev', 'prev'], ['tl-play', 'play'], ['tl-next', 'next']].forEach(([id, k]) => { $(id).innerHTML = icon(k); });

  /* ================= 数据接口层 =================
     后端完成后，只需把 getAnalysis 改成请求后端（返回同样结构的对象）。
     当前实现：浏览器内计算，日线与信号带按标的缓存，拖动回放时不重复拉取。 */
  const _load = CP.load, dataCache = new Map();
  CP.load = async function (sym, opt) {
    if (dataCache.has(sym.key)) return dataCache.get(sym.key);
    const d = await _load.call(CP, sym, opt);
    dataCache.set(sym.key, d);
    return d;
  };
  const _bt = CP.buildTape, tapeCache = new Map();
  CP.buildTape = async function (logp, from, to, step, cb) {
    const k = logp.length + '|' + logp[logp.length - 1].toFixed(6) + '|' + to;
    const c = tapeCache.get(k);
    if (c && c.from <= from) return c.tape.slice();
    const tape = await _bt.call(CP, logp, from, to, step, cb);
    tapeCache.set(k, { from, tape });
    return tape.slice();
  };
  async function getAnalysis(code, asof, onProg) { return OD_API.getAnalysis(code, asof, onProg); }

  let benchCache = null;
  const bench = () => benchCache || (benchCache = CP.indexBench());

  /* ================= 图表（Canvas：主图 + 成交量 + 顶部一致度，共用时间轴与光标） ================= */
  const CH = (function () {
    const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('chartwrap');
    const st = { R: null, a: 0, b: 100, maxI: 100, hover: -1, my: -1, ghost: -1, cross: true, W: 0, H: 0, dpr: 1, drag: null,
      show: { top: true, bot: true, wave: true, real: true, acts: true, vol: true, conf: true } };
    let col = {}, fm = 'monospace', fu = 'sans-serif', onHover = () => {};
    function readCol() {
      const s = getComputedStyle(document.documentElement), g = (n) => s.getPropertyValue(n).trim();
      col = { bg: g('--bg'), surface: g('--surface'), line: g('--line'), grid: g('--grid'), ink: g('--ink'), ink2: g('--ink-2'), ink3: g('--ink-3'), up: g('--up'), dn: g('--dn'), warn: g('--warn'), real: g('--real'), bot: g('--bot'), wave: g('--wave') };
      fm = g('--f-m'); fu = g('--f-u');
    }
    function rgba(hex, a) { const n = parseInt(hex.replace('#', ''), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
    function niceStep(span, n) { const raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

    function size() {
      const r = wrap.getBoundingClientRect();
      st.dpr = window.devicePixelRatio || 1;
      st.W = Math.max(240, r.width); st.H = Math.max(260, r.height);
      cv.width = Math.round(st.W * st.dpr); cv.height = Math.round(st.H * st.dpr);
      draw();
    }
    function geo() {
      const axR = 68, axB = 24, top = 8, gap = 8;
      const W = st.W - axR, inner = st.H - axB - top;
      const fv = st.show.vol ? 0.15 : 0, fc = st.show.conf ? 0.17 : 0;
      const pH = inner * (1 - fv - fc) - (fv ? gap : 0) - (fc ? gap : 0);
      let y = top + pH;
      const g = { axR, axB, W, price: [top, y] };
      if (fv) { g.vol = [y + gap, y + gap + inner * fv]; y = g.vol[1]; }
      if (fc) { g.conf = [y + gap, y + gap + inner * fc]; y = g.conf[1]; }
      g.bottom = top + inner;
      return g;
    }
    function defView(R) {
      const T = R.T, rm = R.rm, N = R.bars.length;
      let b = T + 40;
      if (rm.topW) b = Math.max(b, rm.topW.hi + 12);
      if (rm.crash) b = Math.max(b, rm.crash.botHi + 30);
      if (R.replay) b = Math.max(b, Math.min(N - 1, R.replay.wave2.i + 10));
      b = Math.min(b, T + 150);
      return [Math.max(-5, T - 160), b];
    }
    function clampView() {
      let span = st.b - st.a;
      span = Math.max(30, Math.min(span, st.maxI + 40));
      if (st.a < -20) st.a = -20;
      st.b = st.a + span;
      if (st.b > st.maxI + 20) { st.b = st.maxI + 20; st.a = st.b - span; }
    }

    function tag(txt, x, y, fg, bg, align) {
      ctx.font = '11px ' + fm;
      const w = ctx.measureText(txt).width + 10;
      const x0 = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
      ctx.fillStyle = bg; ctx.fillRect(Math.round(x0), Math.round(y - 9), Math.round(w), 18);
      ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText(txt, x0 + 5, y + 0.5);
    }
    function vline(x, y0, y1, color, dash) {
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash(dash || []);
      ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, y0); ctx.lineTo(Math.round(x) + 0.5, y1); ctx.stroke(); ctx.setLineDash([]);
    }

    function draw() {
      ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
      ctx.fillStyle = col.bg; ctx.fillRect(0, 0, st.W, st.H);
      const R = st.R;
      if (!R) return;
      const bars = R.bars, N = bars.length, T = R.T, rm = R.rm, g = geo();
      const pp = g.W / (st.b - st.a), X = (i) => (i - st.a) * pp;
      const i0 = Math.max(0, Math.floor(st.a)), i1 = Math.min(N - 1, Math.ceil(st.b));
      const realOn = st.show.real && R.replay;
      const lastShown = realOn ? i1 : Math.min(i1, T);
      const vis = (lo, hi) => hi >= st.a && lo <= st.b;

      // 价格范围
      let lo = Infinity, hi = -Infinity;
      for (let i = i0; i <= Math.min(i1, T); i++) { lo = Math.min(lo, bars[i].low); hi = Math.max(hi, bars[i].high); }
      if (realOn) for (let i = Math.max(i0, T + 1); i <= i1; i++) { lo = Math.min(lo, bars[i].close); hi = Math.max(hi, bars[i].close); }
      if (st.show.bot && rm.crash && vis(rm.crash.botLo, rm.crash.botHi)) { lo = Math.min(lo, rm.crash.pxLo); hi = Math.max(hi, rm.crash.pxHi); }
      if (st.show.wave && rm.crash && vis(rm.crash.botHi, rm.crash.botHi + 25)) hi = Math.max(hi, rm.crash.wave2);
      if (st.show.top && rm.topPx && rm.topW && vis(rm.topW.lo, rm.topW.hi)) hi = Math.max(hi, rm.topPx[1]);
      if (!isFinite(lo)) { lo = bars[T].close * 0.9; hi = bars[T].close * 1.1; }
      const ly = [Math.log(lo), Math.log(hi)], lp = (ly[1] - ly[0]) * 0.07 || 0.02;
      ly[0] -= lp; ly[1] += lp;
      const [pt, pb] = g.price;
      const Y = (v) => pb - (Math.log(v) - ly[0]) / (ly[1] - ly[0]) * (pb - pt);

      // 右侧坐标轴底色
      ctx.fillStyle = col.surface; ctx.fillRect(g.W, 0, g.axR, st.H);
      ctx.fillRect(0, g.bottom, st.W, g.axB);
      ctx.strokeStyle = col.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(g.W + 0.5, 0); ctx.lineTo(g.W + 0.5, st.H); ctx.moveTo(0, g.bottom + 0.5); ctx.lineTo(st.W, g.bottom + 0.5); ctx.stroke();
      [g.vol, g.conf].forEach((p) => { if (!p) return; ctx.strokeStyle = col.line; ctx.beginPath(); ctx.moveTo(0, p[0] - 3.5); ctx.lineTo(g.W, p[0] - 3.5); ctx.stroke(); });

      // 价格网格与刻度
      const step = niceStep(Math.exp(ly[1]) - Math.exp(ly[0]), 6);
      ctx.font = '11px ' + fm; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      for (let v = Math.ceil(Math.exp(ly[0]) / step) * step; v <= Math.exp(ly[1]); v += step) {
        const y = Math.round(Y(v)) + 0.5;
        if (y < pt + 6 || y > pb - 4) continue;
        ctx.strokeStyle = col.grid; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(g.W, y); ctx.stroke();
        ctx.fillStyle = col.ink3; ctx.fillText(U.px(v), g.W + 8, y);
      }
      // 时间网格
      const span = st.b - st.a, gran = span > 600 ? 'y' : span > 180 ? 'q' : 'm';
      let prevKey = '', lastX = -999;
      const tEnd = Math.min(Math.ceil(st.b), st.maxI);
      for (let i = Math.max(0, Math.floor(st.a)); i <= tEnd; i++) {
        const d = CP.dateAt(bars, i), mo = +d.slice(5, 7);
        const key = gran === 'y' ? d.slice(0, 4) : gran === 'q' ? d.slice(0, 4) + Math.floor((mo - 1) / 3) : d.slice(0, 7);
        if (key !== prevKey) {
          if (prevKey) {
            const x = X(i);
            vline(x, 0, g.bottom, col.grid);
            if (x - lastX > 60) {
              ctx.fillStyle = col.ink3; ctx.textAlign = 'left';
              ctx.fillText(gran === 'y' ? d.slice(0, 4) : (mo === 1 ? d.slice(0, 4) + '.' : '') + mo + '月', x + 4, g.bottom + 12);
              lastX = x;
            }
          }
          prevKey = key;
        }
      }

      // ---- 主图叠加层 ----
      ctx.save(); ctx.beginPath(); ctx.rect(0, pt, g.W, pb - pt); ctx.clip();
      if (st.show.top && rm.altW && vis(rm.altW.lo, rm.altW.hi)) {
        ctx.fillStyle = rgba(col.warn, 0.05); ctx.fillRect(X(rm.altW.lo), pt, Math.max(2, X(rm.altW.hi + 1) - X(rm.altW.lo)), pb - pt);
      }
      if (st.show.top && rm.topW && vis(rm.topW.lo, rm.topW.hi)) {
        const x0 = X(rm.topW.lo), x1 = X(rm.topW.hi + 1);
        ctx.fillStyle = rgba(col.warn, 0.10); ctx.fillRect(x0, pt, Math.max(2, x1 - x0), pb - pt);
        vline(x0, pt, pb, rgba(col.warn, 0.6)); vline(x1, pt, pb, rgba(col.warn, 0.6));
        if (rm.topPx) { ctx.fillStyle = rgba(col.warn, 0.22); ctx.fillRect(x0, Y(rm.topPx[1]), Math.max(2, x1 - x0), Y(rm.topPx[0]) - Y(rm.topPx[1])); }
        tag('见顶窗口 ' + U.md(rm.topW.loDate).replace('月', '/').replace('日', '') + '–' + U.md(rm.topW.hiDate).replace('月', '/').replace('日', ''), (x0 + x1) / 2, pt + 30, '#0D0D0D', col.warn, 'center');
      }
      if (rm.crash && st.show.bot && vis(rm.crash.botLo, rm.crash.botHi)) {
        const c = rm.crash, x0 = X(c.botLo), x1 = X(c.botHi + 1), y0 = Y(c.pxHi), y1 = Y(c.pxLo);
        ctx.fillStyle = rgba(col.bot, 0.12); ctx.fillRect(x0, y0, Math.max(2, x1 - x0), y1 - y0);
        ctx.strokeStyle = rgba(col.bot, 0.8); ctx.setLineDash([4, 3]); ctx.strokeRect(Math.round(x0) + 0.5, Math.round(y0) + 0.5, Math.round(x1 - x0), Math.round(y1 - y0)); ctx.setLineDash([]);
        tag('预计回落区 ' + U.px(c.pxLo) + '–' + U.px(c.pxHi), (x0 + x1) / 2, Math.min(pb - 12, y1 + 14), '#0D0D0D', col.bot, 'center');
      }
      if (rm.crash && st.show.wave && vis(rm.crash.botHi, rm.crash.botHi + 25)) {
        const c = rm.crash, y = Math.round(Y(c.wave2)) + 0.5, x0 = X(c.botLo), x1 = X(c.botHi + 25);
        ctx.strokeStyle = col.wave; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
        tag('二波参考 ' + U.px(c.wave2), x1, y - 12, '#0D0D0D', col.wave, 'right');
      }

      // K 线（截止日及之前）
      const bw = Math.max(1, pp * 0.7);
      for (let i = i0; i <= Math.min(i1, T); i++) {
        const q = bars[i], up = q.close >= q.open, c = up ? col.up : col.dn, x = X(i);
        ctx.fillStyle = c; ctx.strokeStyle = c;
        const xm = Math.round(x) + 0.5;
        ctx.beginPath(); ctx.moveTo(xm, Y(q.high)); ctx.lineTo(xm, Y(q.low)); ctx.stroke();
        if (pp >= 2.5) {
          const yo = Y(Math.max(q.open, q.close)), yc = Y(Math.min(q.open, q.close));
          ctx.fillRect(Math.round(x - bw / 2), Math.round(yo), Math.max(1, Math.round(bw)), Math.max(1, Math.round(yc - yo)));
        }
      }
      // 截止日后的真实走势
      if (realOn && i1 > T) {
        ctx.strokeStyle = col.real; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
        ctx.beginPath();
        for (let i = T; i <= i1; i++) { const x = X(i), y = Y(bars[i].close); i === T ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
        ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
        const mk = (p, txt, below) => {
          if (p.i <= T || p.i < st.a || p.i > st.b) return;
          const x = X(p.i), y = Y(p.px);
          ctx.fillStyle = col.real; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
          tag(txt + ' ' + U.px(p.px), x, below ? y + 16 : y - 16, '#0D0D0D', col.real, 'center');
        };
        mk(R.replay.peak, '真实顶', false);
        if (R.replay.bottom.i > R.replay.peak.i) mk(R.replay.bottom, '真实底', true);
      }
      // 计划买卖点
      if (st.show.acts && R.replay && R.replay.sim) {
        R.replay.sim.acts.forEach((ac) => {
          if (ac.i < st.a || ac.i > st.b) return;
          const x = X(ac.i), buy = ac.to > ac.from, q = bars[ac.i];
          ctx.fillStyle = buy ? col.up : col.dn;
          ctx.beginPath();
          if (buy) { const y = Y(q.low) + 8; ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 10); ctx.lineTo(x + 6, y + 10); }
          else { const y = Y(q.high) - 8; ctx.moveTo(x, y); ctx.lineTo(x - 6, y - 10); ctx.lineTo(x + 6, y - 10); }
          ctx.closePath(); ctx.fill();
          ctx.font = '600 10px ' + fu; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(buy ? '买' : '卖', x, buy ? Y(q.low) + 28 : Y(q.high) - 28);
        });
      }
      ctx.restore();

      // ---- 成交量 ----
      if (g.vol) {
        const [vt, vb] = g.vol;
        let mv = 0;
        for (let i = i0; i <= lastShown; i++) mv = Math.max(mv, bars[i].volume || 0);
        if (mv > 0) {
          for (let i = i0; i <= lastShown; i++) {
            const q = bars[i], h = (q.volume || 0) / mv * (vb - vt - 2);
            ctx.fillStyle = i > T ? rgba(col.real, 0.35) : rgba(q.close >= q.open ? col.up : col.dn, 0.55);
            ctx.fillRect(Math.round(X(i) - bw / 2), vb - h, Math.max(1, Math.round(bw)), h);
          }
        }
        ctx.font = '11px ' + fu; ctx.fillStyle = col.ink3; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('成交量', 8, vt + 2);
      }
      // ---- 顶部一致度 ----
      if (g.conf) {
        const [ct, cb] = g.conf, cmax = 0.6, Yc = (v) => cb - Math.min(v, cmax) / cmax * (cb - ct - 4);
        const yth = Math.round(Yc(CP.RULES.alertConf)) + 0.5;
        ctx.strokeStyle = rgba(col.warn, 0.7); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(0, yth); ctx.lineTo(g.W, yth); ctx.stroke(); ctx.setLineDash([]);
        ctx.font = '11px ' + fm; ctx.fillStyle = col.ink3; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText('15%', g.W + 8, yth); ctx.fillText('45%', g.W + 8, Yc(0.45));
        const tw = Math.max(1, pp * 4);
        R.tape.forEach((e) => {
          if (e[0] < st.a - 5 || e[0] > st.b) return;
          const c = e[3]; if (!c) return;
          const v = c[3] / e[1], hot = v >= CP.RULES.alertConf && c[0] <= CP.RULES.alertLead;
          ctx.fillStyle = hot ? rgba(col.warn, e[0] > T ? 0.4 : 1) : rgba('#5A5A5A', e[0] > T ? 0.45 : 1);
          ctx.fillRect(Math.round(X(e[0]) - tw / 2), Yc(v), Math.max(1, Math.round(tw)), cb - Yc(v));
        });
        ctx.font = '11px ' + fu; ctx.fillStyle = col.ink3; ctx.textBaseline = 'top';
        ctx.fillText('顶部一致度（琥珀 = 达到预警条件）', 8, ct + 2);
      }

      // 截止日
      const xt = X(T);
      if (xt >= 0 && xt <= g.W) {
        vline(xt, 0, g.bottom, col.ink2, [3, 3]);
        tag((R.latest ? '最新 ' : '截止 ') + R.asof, xt, 10, '#0D0D0D', col.ink2, xt > g.W - 90 ? 'right' : 'center');
      }
      if (st.ghost >= 0 && st.ghost !== T) {
        const xg = X(st.ghost);
        if (xg >= 0 && xg <= g.W) { vline(xg, 0, g.bottom, col.warn, [2, 3]); tag('新截止 ' + bars[st.ghost].date, xg, 30, '#0D0D0D', col.warn, xg > g.W - 110 ? 'right' : 'center'); }
      }
      // 最新价标签
      const yl = Y(bars[T].close);
      if (yl > pt && yl < pb) tag(U.px(bars[T].close), g.W + 2, yl, '#FFFFFF', bars[T].close >= bars[T - 1].close ? col.up : col.dn, 'left');

      // 十字光标
      if (st.cross && st.hover >= 0 && !st.drag) {
        const xh = X(st.hover);
        vline(xh, 0, g.bottom, col.ink3, [2, 3]);
        if (st.my >= 0 && st.my < g.bottom) {
          ctx.strokeStyle = col.ink3; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(0, Math.round(st.my) + 0.5); ctx.lineTo(g.W, Math.round(st.my) + 0.5); ctx.stroke(); ctx.setLineDash([]);
          if (st.my >= pt && st.my <= pb) tag(U.px(Math.exp(ly[0] + (pb - st.my) / (pb - pt) * (ly[1] - ly[0]))), g.W + 2, st.my, '#0D0D0D', col.ink2, 'left');
        }
        tag(CP.dateAt(bars, st.hover), Math.min(Math.max(xh, 44), g.W - 44), g.bottom + 12, '#0D0D0D', col.ink2, 'center');
      }
    }

    function idxAt(x) { const g = geo(); return Math.round(st.a + x / (g.W / (st.b - st.a))); }
    function setHover(i) {
      if (!st.R) return;
      st.hover = i < 0 ? -1 : Math.max(0, Math.min(st.maxI, i));
      draw(); onHover(st.hover);
    }
    function zoom(f, anchor) {
      if (anchor === undefined) anchor = st.hover >= 0 ? st.hover : (st.a + st.b) / 2;
      st.a = anchor - (anchor - st.a) * f; st.b = anchor + (st.b - anchor) * f;
      clampView(); draw();
    }

    cv.addEventListener('pointerdown', (e) => {
      if (!st.R || e.button !== 0) return;
      st.drag = { x: e.clientX, a: st.a, b: st.b, moved: false };
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', (e) => {
      if (!st.R) return;
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (st.drag) {
        const dx = e.clientX - st.drag.x;
        if (Math.abs(dx) > 3) { st.drag.moved = true; cv.classList.add('grab'); }
        const di = dx / (geo().W / (st.drag.b - st.drag.a));
        st.a = st.drag.a - di; st.b = st.drag.b - di; clampView(); draw();
        return;
      }
      st.my = y;
      if (x > geo().W) { setHover(-1); return; }
      setHover(idxAt(x));
    });
    const endDrag = () => { st.drag = null; cv.classList.remove('grab'); };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', () => { if (!st.drag) { st.my = -1; setHover(-1); } });
    cv.addEventListener('wheel', (e) => {
      if (!st.R) return;
      e.preventDefault();
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
      zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, st.a + x / (geo().W / (st.b - st.a)));
    }, { passive: false });
    cv.addEventListener('dblclick', () => api.reset());
    cv.addEventListener('keydown', (e) => {
      if (!st.R) return;
      const h = st.hover >= 0 ? st.hover : st.R.T;
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        e.preventDefault();
        const n = h + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 5 : 1);
        st.my = -1; setHover(n);
        if (n < st.a + 2 || n > st.b - 2) { const sp = st.b - st.a; st.a = n - sp / 2; st.b = n + sp / 2; clampView(); draw(); }
      } else if (k === '+' || k === '=') { e.preventDefault(); zoom(1 / 1.25); }
      else if (k === '-' || k === '_') { e.preventDefault(); zoom(1.25); }
      else if (k === '0') { e.preventDefault(); api.reset(); }
      else if (k === 'Escape') { setHover(-1); }
    });
    new ResizeObserver(size).observe(wrap);

    const api = {
      onHover(fn) { onHover = fn; },
      set(R) {
        st.R = R; st.ghost = -1; st.hover = -1;
        const v = defView(R); st.a = v[0]; st.b = v[1];
        st.maxI = Math.max(R.bars.length - 1, v[1]);
        clampView(); draw();
      },
      reset() { if (!st.R) return; const v = defView(st.R); st.a = v[0]; st.b = v[1]; clampView(); draw(); },
      all() { if (!st.R) return; st.a = 0; st.b = st.maxI; clampView(); draw(); },
      zoom(f) { if (st.R) zoom(f); },
      focus(i) { if (!st.R) return; const sp = st.b - st.a; st.a = i - sp / 2; st.b = i + sp / 2; clampView(); st.my = -1; setHover(i); },
      ghost(i) { st.ghost = i; draw(); },
      toggle(k, on) { st.show[k] = on; draw(); },
      cross(on) { st.cross = on; draw(); },
      redraw() { readCol(); draw(); },
    };
    readCol();
    return api;
  })();

  /* ================= 状态与调度 ================= */
  let cur = null, curCode = '', busy = false, want = null, playing = false, tlTimer = 0, playTimer = 0, planTab = 0;

  function err(m) { $('err').textContent = m || ''; $('err').hidden = !m; }
  function prog(s, p) { $('ld-fill').style.transform = 'scaleX(' + p + ')'; $('ld-s').textContent = s + ' · ' + Math.round(p * 100) + '%'; }
  function request(code, asof) {
    want = { code, asof };
    if (!busy) pump();
  }
  async function pump() {
    busy = true; $('go').disabled = true;
    while (want) {
      const job = want; want = null;
      $('ld-t').textContent = '正在分析 ' + job.code + (job.asof ? '，截止 ' + job.asof : '，最新交易日');
      prog('获取数据', 0);
      $('ld').hidden = false;
      try {
        const R = await getAnalysis(job.code, job.asof, prog);
        if (!want) { curCode = job.code; cur = R; err(''); render(R); }
      } catch (e) {
        err(e.message || String(e)); stopPlay();
      }
    }
    busy = false; $('go').disabled = false;
    if (cur) $('ld').hidden = true;
    else { $('ld-t').textContent = '没有可显示的结果'; $('ld-s').textContent = '请检查代码后重新分析'; }
    if (playing) schedulePlay();
  }

  /* ================= 渲染 ================= */
  const PH_CLASS = { crit: 't-warn', crash: 't-warn', accel: 't-warn', base: 't-bot', wave2: 't-real' };
  const SIM_ST = { hold: '持有', alert: '预警后减仓一半', crash: '空仓等待底部', base: '分批建仓中', wave2: '二波持有' };

  function render(R) {
    const bars = R.bars, T = R.T, rm = R.rm, N = bars.length, last = bars[N - 1].date;
    const name = R.sym.isIndex ? R.sym.label : (R.data.name || R.sym.label);
    const V = U.verdict(R);

    $('sym-n').textContent = name;
    $('sym-c').textContent = R.sym.code + ' · 日线 · 对数坐标';
    $('mode').hidden = false;
    $('mode').textContent = R.latest ? '最新' : '回放 · 截止 ' + R.asof;
    $('mode').className = 'mode od-fixed' + (R.latest ? ' live' : '');
    $('code').value = curCode;
    $('asof').value = R.latest ? '' : R.asof;
    document.querySelectorAll('.tk').forEach((b) => b.setAttribute('aria-current', String(b.dataset.c === R.sym.label)));
    history.replaceState && tryUrl(R);

    // 收盘
    const c0 = bars[T].close, c1 = bars[T - 1].close, ch = c0 / c1 - 1;
    $('px').textContent = U.px(c0);
    $('pxc').className = 'px-chg ' + (ch >= 0 ? 'up' : 'dn');
    $('pxc').textContent = (ch >= 0 ? '▲ ' : '▼ ') + U.px(Math.abs(c0 - c1)) + '  ' + U.sp(ch, 2);
    $('pxs').textContent = (R.latest ? '最新交易日 ' : '截止日 ') + R.asof + ' · 日波动 ' + U.pct(rm.sigma, 2);

    // 结论与阶段
    $('vh').textContent = V.head;
    $('vh').className = 'vh ' + (PH_CLASS[R.phase.k] || '');
    $('vs').textContent = V.sub;
    const pi = CP.PHASES.findIndex((p) => p.k === R.phase.k);
    $('phs').innerHTML = CP.PHASES.map((p, j) => `<li class="ph-${p.k}${j === pi ? ' on' : j < pi ? ' past' : ''}"${j === pi ? ' aria-current="step"' : ''}><span class="n">${j + 1}</span>${E(p.name)}</li>`).join('');
    $('ph-tip').textContent = '当前：' + V.phase.name + ' — ' + V.phase.tip;

    // 关键位置
    const kv = [];
    kv.push(['见顶窗口', rm.topW ? U.range(rm.topW.loDate, rm.topW.hiDate, R.asof, last) : '暂无', rm.topW ? 'wn' : '']);
    kv.push(['窗口一致度', rm.topW ? U.pct(rm.conf, 0) + ' · 可信度' + U.LEVEL[rm.level] : '合格尺度 ' + R.scan.nq + '/' + R.scan.total, '']);
    if (rm.topPx) kv.push(['窗口内参考价', U.px(rm.topPx[0]) + ' – ' + U.px(rm.topPx[1]), '']);
    kv.push(['预计回落区', rm.crash ? U.px(rm.crash.pxLo) + ' – ' + U.px(rm.crash.pxHi) : '—', rm.crash ? 'dn' : '']);
    kv.push(['回落时间', rm.crash ? U.range(rm.crash.botLoDate, rm.crash.botHiDate, R.asof, last) : '需先出现见顶窗口', '']);
    kv.push(['二波参考', rm.crash ? U.px(rm.crash.wave2) : '—', '']);
    $('kv').innerHTML = kv.map((r) => `<li><span class="k">${E(r[0])}</span><span class="v ${r[2]}">${E(r[1])}</span></li>`).join('');

    renderPlan();
    CH.set(R);
    setupTimeline(R);
    cursor(-1);

    $('note').innerHTML = (R.latest ? '' : '<b>回放模式</b>：预测只用了 ' + E(R.asof) + ' 及之前的数据；蓝色虚线是之后的真实走势，模型没有看到。<br>') +
      '数据：' + E(R.data.source) + (R.data.fetchError ? '（实时接口不可达，已用内置快照）' : '') + '。所有概率与区间均未经样本外校准。';

    renderReplay(R);
    renderBench(R);
    renderExpert(R);
  }

  function tryUrl(R) {
    try {
      const u = new URL(location.href);
      u.searchParams.set('code', curCode);
      if (R.latest) u.searchParams.delete('asof'); else u.searchParams.set('asof', R.asof);
      history.replaceState(null, '', u);
    } catch (e) { /* 预览沙盒可能禁止修改地址，忽略 */ }
  }

  function renderPlan() {
    if (!cur) return;
    const R = cur, P = U.plans(R)[planTab];
    document.querySelectorAll('#seg [role=tab]').forEach((b, i) => { b.setAttribute('aria-selected', String(i === planTab)); b.tabIndex = i === planTab ? 0 : -1; });
    $('plan').setAttribute('aria-labelledby', 'sg-' + planTab);
    let h = `<p class="pl-lead">${E(P.lead)}</p><p class="pl-meta">${E(P.meta || '')}</p>`;
    h += '<ol class="pl-rows">' + P.rows.map((r) => `<li><b>${E(r[0])}</b><span>${E(r[1])}</span></li>`).join('') + '</ol>';
    if (planTab === 1) {
      const ck = R.chk;
      if (ck) {
        h += '<ul class="cks" aria-label="底部共振检查">' + ck.items.map((it) => `<li><span class="ck-s${it.ok ? ' ok' : ''}">${it.ok ? '✓ 通过' : '– 未过'}</span><div><div class="ck-n">${E(it.name)}${it.need ? '<small>必要</small>' : ''}</div><div class="ck-d">${E(it.detail)}</div></div></li>`).join('') + '</ul>';
        h += `<p class="ck-sum">通过 <b class="m">${ck.score}/${ck.max}</b> · ${ck.pass ? '<span class="dn">满足进场条件，可以买第一批 1/3</span>' : '不满足进场条件，继续等待'}</p>`;
      } else h += '<p class="pl-meta" style="margin-top:12px">截止日就是近 60 日最高点，还没有开始调整，底部检查暂不适用。</p>';
    }
    $('plan').innerHTML = h;
  }

  function simAt(R, i) {
    const s = R.replay && R.replay.sim;
    if (!s || i < s.from || i > s.to) return null;
    let pos = 1;
    s.acts.forEach((a) => { if (a.i <= i) pos = a.to; });
    return { st: SIM_ST[s.phase[i - s.from]] || '—', pos, eq: s.eq[i - s.from] - 1, bh: s.bh[i - s.from] - 1 };
  }

  function cursor(i) {
    const R = cur; if (!R) return;
    const bars = R.bars, N = bars.length, T = R.T;
    const idx = i >= 0 ? i : T;
    const nm = R.sym.isIndex ? R.sym.label : (R.data.name || R.sym.label);
    // 图例
    if (idx <= N - 1) {
      const q = bars[idx], p = bars[Math.max(0, idx - 1)], ch = q.close / p.close - 1, cls = ch >= 0 ? 'up' : 'dn';
      $('legend').innerHTML = `<b>${E(nm)}</b><span class="lg-k">${q.date}${idx > T ? ' · 模型未见' : ''}</span>` +
        `<span class="lg-k">开</span> <span class="${cls}">${U.px(q.open)}</span><span class="lg-k">高</span> <span class="${cls}">${U.px(q.high)}</span>` +
        `<span class="lg-k">低</span> <span class="${cls}">${U.px(q.low)}</span><span class="lg-k">收</span> <span class="${cls}">${U.px(q.close)}</span>` +
        `<span class="lg-k">${ch >= 0 ? '▲' : '▼'}</span> <span class="${cls}">${U.sp(ch, 2)}</span>`;
    } else {
      $('legend').innerHTML = `<b>${E(nm)}</b><span class="lg-k">${CP.dateAt(bars, idx)} · 未来交易日（日期按工作日推算）</span>`;
    }
    // 右侧读数
    const d = CP.dateAt(bars, idx);
    $('cur-d').textContent = d + (i < 0 ? '（截止日）' : '');
    const lines = [];
    if (idx <= N - 1) {
      const tp = CP.scanAt(R.tape, Math.min(idx, N - 1));
      if (tp && tp[3]) {
        const c = tp[3], v = c[3] / tp[1];
        lines.push('最近一次扫描 ' + bars[tp[0]].date + '：顶部一致度 ' + U.pct(v, 0) + '，指向 ' + U.md(CP.dateAt(bars, tp[0] + c[0])) + '–' + U.md(CP.dateAt(bars, tp[0] + c[1])) + (v >= CP.RULES.alertConf && c[0] <= CP.RULES.alertLead ? '（达到预警条件）' : ''));
      } else if (tp) lines.push('最近一次扫描 ' + bars[tp[0]].date + '：没有一致的见顶窗口');
      const s = simAt(R, idx);
      if (s) lines.push('按计划：' + s.st + '，仓位 ' + Math.round(s.pos * 100) + '%，累计 ' + U.sp(s.eq) + '（持有 ' + U.sp(s.bh) + '）');
      if (idx > T) lines.push('这一天在截止日之后，模型没有看到。');
    } else lines.push('截止日之后的推算区域，只有预测叠加层。');
    $('cur-l').textContent = lines.join('\n');
    $('cur-l').style.whiteSpace = 'pre-line';
    const btn = $('cur-set');
    if (i >= 0 && idx >= 300 && idx <= N - 1 && idx !== T) {
      btn.hidden = false;
      btn.innerHTML = icon('target') + '<span>把 ' + E(bars[idx].date) + ' 设为截止日</span>';
      btn.dataset.i = idx;
    } else btn.hidden = true;
  }

  function setupTimeline(R) {
    const tl = $('tl'), N = R.bars.length;
    tl.disabled = false; tl.min = 300; tl.max = N - 1; tl.value = R.T;
    tl.setAttribute('aria-valuetext', R.asof);
    $('tl-v').textContent = R.asof;
    $('tl-last').disabled = R.latest;
  }

  function renderReplay(R) {
    const el = $('p-replay'), rp = R.replay;
    if (!rp) {
      el.innerHTML = '<p class="tp-d">当前是最新交易日，没有之后的走势可以对照。拖动图表下方的“回放截止日”，或在上方选一个历史场景（例如上证 2026-02-27），即可回放。</p>';
      return;
    }
    const sc = U.score(R), s = rp.sim;
    const idxOf = { '见顶时间': rp.peak.i, '底部时间': rp.bottom.i, '底部价格': rp.bottom.i, '二波高点': rp.wave2.i };
    const left = `<div class="pn"><h3 class="pn-h">预测 vs 真实 · 点击一行在图上定位</h3><div class="scroll-x"><table><thead><tr><th>项目</th><th>当时的预测</th><th>真实结果</th><th>判定</th></tr></thead><tbody>` +
      sc.map((r) => `<tr class="jump" tabindex="0" data-i="${idxOf[r.k]}"><td>${E(r.k)}</td><td>${E(r.pred)}</td><td>${E(r.real)}</td><td class="${r.ok ? 'ok' : 'no'}">${r.ok ? '✓ ' : '✕ '}${E(r.note)}</td></tr>`).join('') +
      '</tbody></table></div>' +
      (rp.firstSig && !rp.topHit ? `<p class="honest">截止日之后，模型在 ${E(rp.firstSig.date)} 首次指向这个真实顶部（提前 ${rp.firstSig.lead} 个交易日，一致度 ${U.pct(rp.firstSig.conf, 0)}）。</p>` : '') + '</div>';
    const right = `<div class="pn"><h3 class="pn-h">按计划操作 · ${E(R.asof)} 至 ${E(s.dates[s.dates.length - 1])}（次日开盘成交，含费用）</h3>` +
      `<div class="kpis od-grid">` +
      `<div class="kpi"><div class="kpi-k">计划收益</div><div class="kpi-v ${s.ret >= 0 ? 'up' : 'dn'}">${U.sp(s.ret)}</div></div>` +
      `<div class="kpi"><div class="kpi-k">一直持有</div><div class="kpi-v ${s.bhRet >= 0 ? 'up' : 'dn'}">${U.sp(s.bhRet)}</div></div>` +
      `<div class="kpi"><div class="kpi-k">计划最大回撤</div><div class="kpi-v">${U.pct(s.mdd)}</div></div>` +
      `<div class="kpi"><div class="kpi-k">持有最大回撤</div><div class="kpi-v">${U.pct(s.bhMdd)}</div></div></div>` +
      '<ul class="acts">' + (s.acts.length ? s.acts.map((a) => { const b = a.to > a.from; return `<li><button type="button" data-i="${a.i}"><span class="ad">${E(a.date)}</span><span class="tag ${b ? 'tag-b' : 'tag-s'}">${b ? '买' : '卖'}</span><span class="ap">${U.px(a.px)}</span><span class="aw">${E(a.why)} · 仓位 ${Math.round(a.from * 100)}% → ${Math.round(a.to * 100)}%</span></button></li>`; }).join('') : '<li class="empty">期间没有触发任何操作</li>') + '</ul></div>';
    el.innerHTML = `<p class="tp-d">把 ${E(R.asof)} 当成“今天”：左边逐项对照预测与真实走势，右边是按操作计划执行的结果（从满仓开始）。</p><div class="cols">${left}${right}</div>`;
  }

  function renderBench(R) {
    const ev = R.evalr, B = bench();
    $('p-bench').innerHTML =
      `<div class="pn" style="margin-bottom:16px"><h3 class="pn-h">本标的顶部信号带</h3>` +
      `<div class="tape-lg od-cluster"><span><i style="background:var(--warn)"></i>达到预警条件的扫描</span><span><i style="background:#3A3A3A"></i>未达条件</span><span><i style="background:var(--dn);border-radius:50%"></i>真实顶 · 被提前抓到</span><span><i style="border:1.5px solid var(--up);border-radius:50%"></i>真实顶 · 漏报</span></div>` +
      `<div class="tape">${U.tapeSVG(R, { span: R.sym.isIndex ? 700 : 500 })}</div>` +
      `<div class="kpis od-grid" style="border-top:1px solid var(--line);border-bottom:0">` +
      `<div class="kpi"><div class="kpi-k">预警段数</div><div class="kpi-v">${ev.nEp}</div></div>` +
      `<div class="kpi"><div class="kpi-k">预警后确实见顶</div><div class="kpi-v">${U.pct(ev.precision, 0)}</div></div>` +
      `<div class="kpi"><div class="kpi-k">随机预警的命中率</div><div class="kpi-v">${U.pct(ev.randPrecision, 0)}</div></div>` +
      `<div class="kpi"><div class="kpi-k">真实顶被提前抓到</div><div class="kpi-v">${U.pct(ev.recall, 0)} <small>/ ${ev.nEv} 个</small></div></div></div></div>` +
      `<div class="pn"><h3 class="pn-h">三大指数全样本（2015 年起，每 5 个交易日一个截止日）</h3><div class="scroll-x"><table><thead><tr><th>指数</th><th>预警后确实见顶</th><th>随机基线</th><th>真实顶被提前抓到</th><th>2016 年起 计划 / 持有</th><th>最大回撤 计划 / 持有</th><th>2024 年起 计划 / 持有</th></tr></thead><tbody>` +
      B.map((b) => `<tr><td>${E(b.label)}</td><td>${U.pct(b.ev.precision, 0)}（${b.ev.nEp} 段）</td><td>${U.pct(b.ev.randPrecision, 0)}</td><td>${U.pct(b.ev.recall, 0)}（${b.ev.nEv} 个顶）</td><td>${U.sp(b.s16.ret, 0)} / ${U.sp(b.s16.bh, 0)}</td><td>${U.pct(b.s16.mdd, 0)} / ${U.pct(b.s16.bhMdd, 0)}</td><td>${U.sp(b.s24.ret, 0)} / ${U.sp(b.s24.bh, 0)}</td></tr>`).join('') +
      '</tbody></table></div><p class="honest">结论：预警一旦出现，事后大多确实见顶，明显高于随机放置窗口；但它只能提前抓到约 15–20% 的真实顶部——多数顶部不是加速泡沫形成的。它适合作为“出现就要重视”的逃顶警报，不能作为唯一的卖出依据。每个指数只有 7–8 段预警，样本量小。</p></div>';
  }

  function renderExpert(R) {
    const fits = R.scan.fits;
    $('p-expert').innerHTML = `<p class="tp-d">合格条件：${E(CP.TOP_RULE)}。“距今”是临界时间 t_c 距截止日的交易日数。这些参数只用于诊断，不直接用于决策。</p>` +
      `<div class="pn"><div class="scroll-x" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>窗口</th><th>起点</th><th>距今</th><th>指向日期</th><th>m 幂指数</th><th>ω 频率</th><th>振荡数</th><th>阻尼</th><th>R²</th><th>合格</th></tr></thead><tbody>` +
      fits.map((f) => `<tr><td>${f.n}</td><td>${R.bars[R.T + 1 - f.n].date}</td><td>${f.ahead.toFixed(1)}</td><td>${CP.dateAt(R.bars, R.T + Math.round(f.ahead))}</td><td>${f.m.toFixed(2)}</td><td>${f.w.toFixed(2)}</td><td>${f.O.toFixed(2)}</td><td>${f.D.toFixed(2)}</td><td>${f.R2.toFixed(3)}</td><td class="${f.q ? 'q' : ''}">${f.q ? '✓ 是' : '—'}</td></tr>`).join('') +
      '</tbody></table></div></div>';
  }

  /* ================= 行情带（内置快照最后两日） ================= */
  (function ticker() {
    const S = window.OD_SNAP || {}, out = [];
    Object.keys(CP.INDEX).forEach((k) => {
      const s = S[k]; if (!s) return;
      const rows = s.rows.split(';'), a = rows[rows.length - 1].split(','), b = rows[rows.length - 2].split(',');
      const c = +a[2], p = +b[2], ch = c / p - 1, cls = ch >= 0 ? 'up' : 'dn';
      out.push(`<button class="tk" type="button" data-c="${E(CP.INDEX[k].label)}" aria-current="false"><span class="tk-n">${E(CP.INDEX[k].label)} · ${a[0].slice(4, 6)}/${a[0].slice(6, 8)}</span><span class="tk-v">${U.px(c)}<span class="${cls}">${ch >= 0 ? '▲' : '▼'} ${U.sp(ch, 2)}</span></span></button>`);
    });
    $('ticker').innerHTML = out.join('');
  })();

  /* ================= 交互绑定 ================= */
  function submit() {
    const code = $('code').value.trim();
    if (!CP.resolve(code)) { err('无法识别“' + code + '”：请输入 6 位 A 股代码（如 600519），或“上证指数 / 沪深300 / 创业板指”。'); $('code').focus(); return; }
    stopPlay(); err('');
    request(code, $('asof').value);
  }
  $('go').addEventListener('click', submit);
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  $('asof').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip, .tk');
    if (chip) { stopPlay(); $('code').value = chip.dataset.c; $('asof').value = chip.dataset.d || ''; request(chip.dataset.c, chip.dataset.d || ''); }
  });

  // 工具栏
  $('b-cross').addEventListener('click', (e) => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); CH.cross(on); });
  $('b-zin').addEventListener('click', () => CH.zoom(1 / 1.3));
  $('b-zout').addEventListener('click', () => CH.zoom(1.3));
  $('b-reset').addEventListener('click', () => CH.reset());
  $('b-all').addEventListener('click', () => CH.all());
  $('toggles').addEventListener('click', (e) => {
    const b = e.target.closest('.tgb'); if (!b) return;
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on)); CH.toggle(b.dataset.k, on);
  });

  // 图表 → 右侧读数
  CH.onHover((i) => cursor(i));
  $('cur-set').addEventListener('click', (e) => { const i = +e.currentTarget.dataset.i; if (cur && i >= 0) { stopPlay(); jumpTo(i); } });

  // 回放时间轴
  function jumpTo(i) {
    if (!cur) return;
    const N = cur.bars.length;
    i = Math.max(300, Math.min(N - 1, i));
    $('tl').value = i; $('tl-v').textContent = cur.bars[i].date;
    CH.ghost(i);
    request(curCode, i === N - 1 ? '' : cur.bars[i].date);
  }
  $('tl').addEventListener('input', (e) => {
    if (!cur) return;
    stopPlay();
    const i = +e.target.value, d = cur.bars[i].date;
    $('tl-v').textContent = d; e.target.setAttribute('aria-valuetext', d);
    CH.ghost(i);
    clearTimeout(tlTimer);
    tlTimer = setTimeout(() => jumpTo(i), 450);
  });
  $('tl').addEventListener('change', (e) => { clearTimeout(tlTimer); jumpTo(+e.target.value); });
  $('tl-prev').addEventListener('click', () => { if (cur) { stopPlay(); jumpTo(cur.T - 5); } });
  $('tl-next').addEventListener('click', () => { if (cur) { stopPlay(); jumpTo(cur.T + 5); } });
  $('tl-last').addEventListener('click', () => { if (cur) { stopPlay(); jumpTo(cur.bars.length - 1); } });
  function setPlayBtn() {
    const b = $('tl-play');
    b.setAttribute('aria-pressed', String(playing));
    b.setAttribute('aria-label', playing ? '暂停自动回放' : '自动逐周回放');
    b.title = playing ? '暂停' : '自动逐周回放';
    b.innerHTML = icon(playing ? 'pause' : 'play');
  }
  function stopPlay() { if (!playing) return; playing = false; clearTimeout(playTimer); setPlayBtn(); }
  function schedulePlay() {
    clearTimeout(playTimer);
    playTimer = setTimeout(() => {
      if (!playing || !cur) return;
      if (cur.T >= cur.bars.length - 1) { stopPlay(); return; }
      jumpTo(cur.T + 5);
    }, 400);
  }
  $('tl-play').addEventListener('click', () => {
    if (!cur) return;
    playing = !playing; setPlayBtn();
    if (playing) { if (cur.T >= cur.bars.length - 1) jumpTo(300); else if (!busy) schedulePlay(); }
    else clearTimeout(playTimer);
  });

  // 操作计划分段
  $('seg').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (!b) return; planTab = +b.dataset.i; renderPlan(); });
  $('seg').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); planTab = (planTab + (e.key === 'ArrowRight' ? 1 : 2)) % 3; renderPlan(); $('sg-' + planTab).focus();
  });

  // 底部面板
  const btabs = Array.from(document.querySelectorAll('#btabs [role=tab]'));
  function selectBottom(k) {
    btabs.forEach((b, i) => { const on = i === k; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $(b.dataset.p).hidden = !on; });
  }
  $('btabs').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) selectBottom(btabs.indexOf(b)); });
  $('btabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const k = (btabs.findIndex((b) => b.getAttribute('aria-selected') === 'true') + (e.key === 'ArrowRight' ? 1 : 2)) % 3;
    selectBottom(k); btabs[k].focus();
  });
  // 回放表格 / 操作记录 → 图上定位
  $('p-replay').addEventListener('click', (e) => { const r = e.target.closest('[data-i]'); if (r) CH.focus(+r.dataset.i); });
  $('p-replay').addEventListener('keydown', (e) => { if (e.key !== 'Enter' && e.key !== ' ') return; const r = e.target.closest('tr[data-i]'); if (r) { e.preventDefault(); CH.focus(+r.dataset.i); } });

  /* ================= 启动 ================= */
  const qs = new URLSearchParams(location.search);
  const c0 = qs.get('code') || '上证指数', d0 = qs.get('code') ? (qs.get('asof') || '') : '2026-02-27';
  $('code').value = c0; $('asof').value = d0;
  request(c0, d0);
})();
</script>
</body>
</html>
