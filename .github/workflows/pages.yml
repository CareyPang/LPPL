name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "frontend/**"
      - "scripts/build_site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch stock-results history
        run: git fetch origin +refs/heads/stock-results:refs/heads/stock-results +refs/heads/stock-results:refs/remotes/origin/stock-results || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 首次运行自动创建 Pages 站点（源=GitHub Actions），无需手动在 Settings 开启
      - name: Build public and lab sites
        run: bash scripts/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 单独的部署 job：上传完成后才开始，避免 deploy-pages 在同一 job 内查不到刚上传的 artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
