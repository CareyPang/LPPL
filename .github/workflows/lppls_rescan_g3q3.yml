name: lppls_rescan_g3q3

# 预登记 §20 偏离 _g3（tcgrid_lm ∧ de_lbfgsb 取最小 SSE）+ §22.3 Q3（过 box 的窗口 K=20 循环平移对照，q3_p），只在开发段重扫 6 指数，
# 输出 data/features/lppls_v2_g3q3/（含 g3_src、q3_p 两列；其余列口径与现行扫描相同）。
# 手动触发；每个 job = 1 个指数 × 1 个日期分片（交错切分），产物由 merge job 合并成 <sym>.parquet 的 artifact（不入库）。

on:
  workflow_dispatch:
    inputs:
      segment:
        description: Dataset segment
        type: choice
        options:
          - dev
          - cal
          - test
        default: dev
      q3:
        description: Q3 surrogate count (0 or 20)
        type: string
        default: "20"
      n_min:
        description: Minimum window length (empty disables the lower bound)
        type: string
        default: ""
      n_max:
        description: Maximum window length (empty disables the upper bound)
        type: string
        default: ""
      symbols:
        description: Comma-separated index symbols (dev segment only)
        type: string
        default: "sh000001,sh000016,sh000300,sh000905,sz399001,sz399006"
      shards:
        description: Date shards per symbol (1–20)
        type: string
        default: "20"
      out_tag:
        description: LPPLS_OUT_TAG (output dir suffix)
        type: string
        default: "_g3q3"

permissions:
  contents: read

concurrency:
  group: lppls-rescan-${{ inputs.segment }}-${{ inputs.out_tag }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    env:
      INPUT_SYMBOLS: ${{ inputs.symbols }}
      INPUT_SHARDS: ${{ inputs.shards }}
      INPUT_SEGMENT: ${{ inputs.segment }}
      INPUT_Q3: ${{ inputs.q3 }}
      INPUT_N_MIN: ${{ inputs.n_min }}
      INPUT_N_MAX: ${{ inputs.n_max }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_SEGMENT" != "dev" && "$INPUT_SEGMENT" != "cal" && "$INPUT_SEGMENT" != "test" ]]; then
            echo "segment must be dev, cal, or test" >&2; exit 1
          fi
          if [[ "$INPUT_Q3" != "0" && "$INPUT_Q3" != "20" ]]; then
            echo "q3 must be 0 or 20" >&2; exit 1
          fi
          if [[ -n "$INPUT_N_MIN" && ! "$INPUT_N_MIN" =~ ^[0-9]{1,4}$ ]]; then
            echo "n_min must be empty or 1–4 digits" >&2; exit 1
          fi
          if [[ -n "$INPUT_N_MAX" && ! "$INPUT_N_MAX" =~ ^[0-9]{1,4}$ ]]; then
            echo "n_max must be empty or 1–4 digits" >&2; exit 1
          fi
          if [[ ! "$INPUT_SHARDS" =~ ^[0-9]{1,2}$ ]] || (( 10#$INPUT_SHARDS < 1 || 10#$INPUT_SHARDS > 20 )); then
            echo "shards must be 1–20" >&2; exit 1
          fi
          if [[ ! "$INPUT_SYMBOLS" =~ ^[a-z]{2}[0-9]{6}(,[a-z]{2}[0-9]{6})*$ ]]; then
            echo "symbols must look like sh000001,sz399001" >&2; exit 1
          fi
          shards=$((10#$INPUT_SHARDS))
          matrix=$(SYMS="$INPUT_SYMBOLS" N="$shards" SEGMENT="$INPUT_SEGMENT" python3 -c 'import json,os; syms=os.environ["SYMS"].split(","); n=int(os.environ["N"]); syms=[s for s in syms if not (os.environ["SEGMENT"] == "dev" and s == "sh000688")]; print(json.dumps({"include": [{"symbol": s, "shard": i} for s in syms for i in range(n)]}))')
          printf 'shards=%s\nmatrix=%s\n' "$shards" "$matrix" >> "$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Scan shard (v2 box, _g3 + Q3)
        shell: bash
        env:
          LPPLS_BOX: v2
          LPPLS_OUT_TAG: ${{ inputs.out_tag }}
          LPPLS_SYMBOLS: ${{ matrix.symbol }}
          LPPLS_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
          LPPLS_PROCS: "4"
          LPPLS_G3: "1"
          LPPLS_Q3: ${{ inputs.q3 }}
          LPPLS_NMIN: ${{ inputs.n_min }}
          LPPLS_NMAX: ${{ inputs.n_max }}
          INPUT_SEGMENT: ${{ inputs.segment }}
        run: |
          set -euo pipefail
          python -c "import os; from research.features import lppls_scan as L; assert L.G3 and L.OPT == 'g3' and L.Q3_K == int(os.environ['LPPLS_Q3']); assert L.COLS[-1] == ('q3_p' if L.Q3_K else 'g3_src'); assert (L.NMIN, L.NMAX) == tuple(int(os.environ[name]) if os.environ[name] else None for name in ('LPPLS_NMIN', 'LPPLS_NMAX'))"
          python -m research.features.lppls_scan index "$INPUT_SEGMENT"
          ls -la "data/features/lppls_v2${LPPLS_OUT_TAG}"
      - uses: actions/upload-artifact@v4
        with:
          name: lppls-rescan-${{ matrix.symbol }}-${{ matrix.shard }}
          path: data/features/lppls_v2${{ inputs.out_tag }}/
          if-no-files-found: error

  merge:
    needs: [plan, scan]
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: lppls-rescan-*
          merge-multiple: true
          path: data/features/lppls_v2${{ inputs.out_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/merge_scan_parts.py "data/features/lppls_v2${{ inputs.out_tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lppls_v2${{ inputs.out_tag }}-merged
          path: |
            data/features/lppls_v2${{ inputs.out_tag }}/*.parquet
            !data/features/lppls_v2${{ inputs.out_tag }}/*__part*.parquet
          if-no-files-found: error
          retention-days: 90
