name: ci
on: [push, pull_request]
jobs:
  preview-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check isolated preview coordinator with real SQLite reservations
        run: node --test frontend/demo-tools/preview-worker.test.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: ruff check research tests
      - name: Verify stock browser and Worker contracts
        run: node --test frontend/tests/*.test.cjs workers/stock-query/test/*.test.mjs
      - run: pytest -m "not network"
