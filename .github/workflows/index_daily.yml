name: index_daily

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/index_daily.yml
      - research/pipeline/daily.py
      - scripts/build_site.sh
      - research/data/freshness.py

concurrency:
  group: index-daily
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asof: ${{ steps.plan.outputs.asof }}
      symbols: ${{ steps.plan.outputs.symbols }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Plan latest closed-day index fits
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          asof="$(python -c 'from research.data.trading_date import latest_closed_trading_day; print(latest_closed_trading_day())')"
          symbols='["sh000001","sh000016","sh000300","sh000905","sh000688","sz399001","sz399006"]'
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            symbols='["sh000001"]'
          fi
          {
            printf 'asof=%s\n' "$asof"
            printf 'symbols=%s\n' "$symbols"
          } >> "$GITHUB_OUTPUT"
          printf 'asof=%s; planned symbols=%s\n' \
            "$asof" "$symbols" >> "$GITHUB_STEP_SUMMARY"

  fit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sym: ${{ fromJSON(needs.plan.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run latest closed-day index fit
        env:
          ASOF: ${{ needs.plan.outputs.asof }}
          SYM: ${{ matrix.sym }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/index
          LPPLS_BOX=v2 python -m research.pipeline.daily "$SYM" \
            --asof "$ASOF" --out out/index
      - name: Upload index fit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-fit-${{ matrix.sym }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/index/*.json
          if-no-files-found: warn

  publish:
    needs: [plan, fit]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Download index fit artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: index-fit-*-${{ github.run_id }}-*
          path: out/artifacts
      - name: Publish to stock-results
        env:
          GH_TOKEN: ${{ github.token }}
          ASOF: ${{ needs.plan.outputs.asof }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin stock-results
          git switch -c index-publish origin/stock-results
          mkdir -p index
          published=()
          published_symbols=()
          missing_symbols=()
          for sym in sh000001 sh000016 sh000300 sh000905 sh000688 sz399001 sz399006; do
            dir="$(ls -d "out/artifacts/index-fit-${sym}-${GITHUB_RUN_ID}-"* 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "$dir" ]]; then
              source="$dir/${sym}_${ASOF}.json"
            else
              source=""
            fi
            if [[ -n "$source" && -f "$source" ]]; then
              target="index/${sym}_latest.json"
              cp "$source" "$target"
              published+=("$target")
              published_symbols+=("$sym")
            else
              missing_symbols+=("$sym")
            fi
          done
          {
            printf '## Index daily publish (%s)\n\n' "$ASOF"
            printf 'Published symbols: %s\n' "${published_symbols[*]:-none}"
            printf 'Missing symbols: %s\n' "${missing_symbols[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#published[@]} == 0 )); then
            echo "No index JSON files found to publish" >&2
            exit 1
          fi
          git add "${published[@]}"
          if git diff --cached --quiet; then
            echo "No index snapshots changed"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "index: 发布 7 指数 LPPLS ${ASOF}"
            pushed=false
            for attempt in 1 2 3; do
              echo "stock-results push attempt ${attempt}/3"
              if git push origin HEAD:stock-results; then
                pushed=true
                break
              fi
              if (( attempt < 3 )); then
                git fetch --no-tags origin stock-results
                git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  rebase origin/stock-results
              fi
            done
            if [[ "$pushed" != true ]]; then
              echo "Failed to publish index snapshots after 3 attempts" >&2
              exit 1
            fi
          fi
          gh workflow run pages.yml --ref main
