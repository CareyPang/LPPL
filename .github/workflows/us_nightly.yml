name: us_nightly

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: us-nightly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Generate current and history records
        run: python -m research.pipeline.us_nightly --out out/stock --history-weeks 104 --procs 2
      - name: Print ticker status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("out/stock/us_index.json")
          if path.exists():
              for row in json.loads(path.read_text()):
                  print(f"{row['ticker']}: {'ok' if row['ok'] else 'err'} {row.get('asof') or ''}")
          else:
              print("US collector produced no index")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-stock-results
          path: out/stock/US_*.json
          if-no-files-found: warn
      - name: Publish to stock-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin stock-results
          git switch -c us-publish origin/stock-results
          mkdir -p stock
          cp out/stock/US_*.json stock/
          cp out/stock/us_index.json stock/us_index.json
          git add stock/US_*.json stock/us_index.json
          if git diff --cached --quiet; then
            echo "No US stock records changed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "美股：发布观察清单日线与历史结果"
          git push origin HEAD:stock-results
          gh workflow run pages.yml --ref main
