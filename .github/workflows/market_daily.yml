name: market_daily

on:
  schedule:
    - cron: "0 10 * * 1-5" # 18:00 Asia/Shanghai, weekdays
  workflow_dispatch:
  pull_request:
    paths:
      - research/data/market_base.py
      - research/data/events.py
      - research/data/abnormal.py
      - research/data/range_stats.py
      - frontend/market.html
      - frontend/stock.html
      - frontend/app/lppl-data.js
      - .github/workflows/market_daily.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: market-daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        id: install
        run: python -m pip install -e .
      - name: Fetch market review
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat())')"
          echo "asof=$snapshot_date" >> "$GITHUB_OUTPUT"
          python -m research.data.market_base --date "$snapshot_date" --out out/market
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("out/market/market_latest.json").read_text(encoding="utf-8"))["sources"]
          for name, source in sources.items():
              status = "ok" if source.get("ok") else "failed"
              print(f"{name}: {status}" + (f" — {source.get('error')}" if source.get("error") else ""))
          print(f"limit_pools_publishable={sources.get('limit_pools', {}).get('ok', False)}")
          PY
          limit_ok="$(python -c 'import json; print(str(json.load(open("out/market/market_latest.json"))["sources"].get("limit_pools", {}).get("ok", False)).lower())')"
          echo "limit_ok=$limit_ok" >> "$GITHUB_OUTPUT"
          if [[ "$limit_ok" != "true" ]]; then
            echo "limit_pools failed; keeping the previous published snapshot"
          fi
      - name: Fetch and publish event calendar
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat())')"
          git fetch --no-tags origin stock-results
          mkdir -p out/events
          if git cat-file -e origin/stock-results:events/events_latest.json 2>/dev/null; then
            git show origin/stock-results:events/events_latest.json > out/events/previous.json
            python -m research.data.events --date "$snapshot_date" --out out/events --previous out/events/previous.json
          else
            python -m research.data.events --date "$snapshot_date" --out out/events
          fi
          git switch -c events-publish origin/stock-results
          mkdir -p events
          cp out/events/events_latest.json events/events_latest.json
          cp "out/events/events_${snapshot_date}.json" "events/events_${snapshot_date}.json"
          git add events/events_latest.json "events/events_${snapshot_date}.json"
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "events: 发布事件日历 ${snapshot_date}"
            git push origin HEAD:stock-results
            gh workflow run pages.yml --ref main
          fi
      - name: Collect abnormal alerts
        id: abnormal
        if: always() && steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python -m research.data.abnormal --market out/market/market_latest.json --out out/abnormal
      - name: Collect board range statistics
        id: range_stats
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git fetch --no-tags origin stock-results:refs/remotes/origin/stock-results
          python -m research.data.range_stats --git-ref origin/stock-results --out out/range
      - name: Publish to stock-results
        if: always() && steps.install.outcome == 'success' && (steps.fetch.outputs.limit_ok == 'true' || steps.abnormal.outcome == 'success' || steps.range_stats.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="${{ steps.fetch.outputs.asof }}"
          git fetch --no-tags origin stock-results:refs/remotes/origin/stock-results
          git switch -c market-publish origin/stock-results
          mkdir -p market
          if [[ "${{ steps.fetch.outputs.limit_ok }}" == "true" ]]; then
            cp out/market/market_latest.json market/market_latest.json
            cp "out/market/market_${snapshot_date}.json" "market/${snapshot_date}.json"
            git add market/market_latest.json "market/${snapshot_date}.json"
          fi
          if [[ -f out/abnormal/abnormal_latest.json ]]; then
            cp out/abnormal/abnormal_latest.json market/abnormal_latest.json
            git add market/abnormal_latest.json
          fi
          if [[ -f out/range/range_latest.json ]]; then
            cp out/range/range_latest.json market/range_latest.json
            git add market/range_latest.json
          fi
          if git diff --cached --quiet; then
            echo "No market auxiliary output changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "market: 发布市场背景数据 ${snapshot_date:-auxiliary}"
          git push origin HEAD:stock-results
          gh workflow run pages.yml --ref main

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Smoke event calendar
        continue-on-error: true
        run: python -m research.data.events --out out/events
      - name: Smoke abnormal output
        continue-on-error: true
        run: python -m research.data.abnormal --market web/mock/data/market/market_latest.json --out out/abnormal
      - name: Smoke range output
        continue-on-error: true
        run: python -m research.data.range_stats --history-dir web/mock/data/market --out out/range
      - name: Fetch without publishing and summarize sources
        shell: bash
        run: |
          snapshot_date="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat())')"
          python -m research.data.market_base --date "$snapshot_date" --out out/market
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("out/market/market_latest.json").read_text(encoding="utf-8"))["sources"]
          for name, source in sources.items():
              status = "ok" if source.get("ok") else "failed"
              print(f"{name}: {status}" + (f" — {source.get('error')}" if source.get("error") else ""))
          PY
      - name: Upload market smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-smoke-${{ github.run_id }}
          path: out/market
          if-no-files-found: warn
