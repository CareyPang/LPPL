name: market_daily

on:
  schedule:
    - cron: "45 7 * * 1-5" # UTC 07:45 / 15:45 Asia/Shanghai; GitHub cron may run much later
    - cron: "30 8 * * 1-5" # UTC 08:30 / 16:30 Asia/Shanghai; GitHub cron may run much later
    - cron: "0 11 * * 1-5" # UTC 11:00 / 19:00 Asia/Shanghai; GitHub cron may run much later
  repository_dispatch:
    types: [market_daily]
  workflow_dispatch:
  pull_request:
    paths:
      - research/data/abnormal.py
      - research/data/bottom_signal.py
      - research/data/range_stats.py
      - research/data/market_base.py
      - research/data/events.py
      - research/data/trading_date.py
      - research/dip/env.py
      - tests/test_trading_date.py
      - tests/test_market_workflows.py
      - frontend/market.html
      - frontend/stock.html
      - frontend/app/lppl-data.js
      - .github/workflows/market_daily.yml
      - scripts/build_stock_list.py
      - tests/test_build_stock_list.py
      - pyproject.toml

permissions:
  contents: write
  actions: write

concurrency:
  group: market-daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        id: install
        run: python -m pip install -e .
      - name: Build stock autocomplete list
        id: stock_list
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          if python scripts/build_stock_list.py --out out/market/stock_list.json; then
            echo "stock_list_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::stock list refresh failed; retaining the last published list"
            echo "stock_list_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect board range statistics
        id: range_stats
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git fetch --no-tags origin stock-results:refs/remotes/origin/stock-results
          python -m research.data.range_stats --git-ref origin/stock-results --out out/range
      - name: Fetch market review
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="$(python -m research.data.trading_date)"
          echo "asof=$snapshot_date" >> "$GITHUB_OUTPUT"
          mkdir -p out/previous-market
          if git cat-file -e origin/stock-results:market 2>/dev/null; then
            git archive origin/stock-results market | tar -xf - -C out/previous-market --strip-components=1
          fi
          python -m research.data.market_base --date "$snapshot_date" --out out/market --prev-dir out/previous-market
          abnormal_ok=false
          if python -m research.data.abnormal --market out/market/market_latest.json --out out/abnormal; then
            abnormal_ok=true
          fi
          echo "abnormal_ok=$abnormal_ok" >> "$GITHUB_OUTPUT"
          bottom_ok=false
          if python -m research.data.bottom_signal --out out/bottom; then
            bottom_ok=true
          fi
          echo "bottom_ok=$bottom_ok" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("out/market/market_latest.json").read_text(encoding="utf-8"))["sources"]
          for name, source in sources.items():
              status = "ok" if source.get("ok") else "failed"
              print(f"{name}: {status}" + (f" — {source.get('error')}" if source.get("error") else ""))
          print(f"limit_pools_publishable={sources.get('limit_pools', {}).get('ok', False)}")
          PY
          limit_ok="$(python -c 'import json; print(str(json.load(open("out/market/market_latest.json"))["sources"].get("limit_pools", {}).get("ok", False)).lower())')"
          echo "limit_ok=$limit_ok" >> "$GITHUB_OUTPUT"
          if [[ "$limit_ok" != "true" ]]; then
            echo "limit_pools failed; keeping the previous published snapshot"
          fi
      - name: Fetch and publish event calendar
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/scripts/publish_versioned.py" "$RUNNER_TEMP/publish_versioned.py"
          snapshot_date="$(python -m research.data.trading_date)"
          git fetch --no-tags origin stock-results
          mkdir -p out/events
          if git cat-file -e origin/stock-results:events/events_latest.json 2>/dev/null; then
            git show origin/stock-results:events/events_latest.json > out/events/previous.json
            python -m research.data.events --date "$snapshot_date" --out out/events --previous out/events/previous.json
          else
            python -m research.data.events --date "$snapshot_date" --out out/events
          fi
          git switch -c events-publish origin/stock-results
          mkdir -p events
          event_paths="$(python "$RUNNER_TEMP/publish_versioned.py" --kind events --src "$GITHUB_WORKSPACE/out/events/events_latest.json" --root "$GITHUB_WORKSPACE")"
          if [[ -n "$event_paths" ]]; then
            mapfile -t event_paths_to_add <<< "$event_paths"
            git add -- "${event_paths_to_add[@]}"
          fi
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "events: 发布事件日历 ${snapshot_date}"
            git push origin HEAD:stock-results
            gh workflow run pages.yml --ref main
          fi
      - name: Publish to stock-results
        if: always() && steps.install.outcome == 'success' && (steps.fetch.outputs.limit_ok == 'true' || steps.fetch.outputs.abnormal_ok == 'true' || steps.fetch.outputs.bottom_ok == 'true' || steps.range_stats.outcome == 'success' || steps.stock_list.outputs.stock_list_ok == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="${{ steps.fetch.outputs.asof }}"
          git fetch --no-tags origin stock-results:refs/remotes/origin/stock-results
          git switch -c market-publish origin/stock-results
          mkdir -p market
          publish_versioned() {
            local kind="$1" src="$2" paths
            paths="$(python "$RUNNER_TEMP/publish_versioned.py" --kind "$kind" --src "$src" --root "$GITHUB_WORKSPACE")"
            if [[ -n "$paths" ]]; then
              mapfile -t paths_to_add <<< "$paths"
              git add -- "${paths_to_add[@]}"
            fi
          }
          if [[ -f out/market/stock_list.json ]]; then
            cp out/market/stock_list.json market/stock_list.json
            git add market/stock_list.json
          fi
          if [[ "${{ steps.fetch.outputs.limit_ok }}" == "true" ]]; then
            publish_versioned market "$GITHUB_WORKSPACE/out/market/market_latest.json"
          fi
          if [[ -f out/abnormal/abnormal_latest.json ]]; then
            publish_versioned abnormal "$GITHUB_WORKSPACE/out/abnormal/abnormal_latest.json"
          fi
          if [[ -f out/bottom/bottom_signal_latest.json ]]; then
            publish_versioned bottom_signal "$GITHUB_WORKSPACE/out/bottom/bottom_signal_latest.json"
          fi
          if [[ -f out/range/range_latest.json ]]; then
            publish_versioned range "$GITHUB_WORKSPACE/out/range/range_latest.json"
          fi
          if git diff --cached --quiet; then
            echo "No market auxiliary output changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "market: 发布市场背景数据 ${snapshot_date:-auxiliary}"
          git push origin HEAD:stock-results
          gh workflow run pages.yml --ref main

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Smoke event calendar
        continue-on-error: true
        run: python -m research.data.events --date "$(python -m research.data.trading_date)" --out out/events
      - name: Fetch without publishing and summarize sources
        shell: bash
        run: |
          snapshot_date="$(python -m research.data.trading_date)"
          python -m research.data.market_base --date "$snapshot_date" --out out/market
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("out/market/market_latest.json").read_text(encoding="utf-8"))["sources"]
          for name, source in sources.items():
              status = "ok" if source.get("ok") else "failed"
              print(f"{name}: {status}" + (f" — {source.get('error')}" if source.get("error") else ""))
          PY
      - name: Upload market smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-smoke-${{ github.run_id }}
          path: out/market
          if-no-files-found: warn
      - name: Smoke abnormal output
        continue-on-error: true
        run: python -m research.data.abnormal --market web/mock/data/market/market_latest.json --out out/abnormal
      - name: Smoke bottom signal
        continue-on-error: true
        run: python -m research.data.bottom_signal --out out/bottom
      - name: Smoke range output
        continue-on-error: true
        run: python -m research.data.range_stats --history-dir web/mock/data/market --out out/range
