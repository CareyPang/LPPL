name: forward_log_seal
# 前瞻日志每日封存：跑 scripts/daily_update.sh（6 指数最新 as-of 拟合 → 契约 JSON → forward_log seal），
# 只把 forward_log/ 的新增提交到 main（追加式，不改已封存文件）。取数走 research.data.cache（腾讯/新浪，限速）。
# 取数失败的交易日不补封（补了就不是 PIT）；缺日由 forward_log_check 周检报告。

on:
  schedule:
    - cron: "30 10 * * 1-5" # 18:30 Asia/Shanghai, weekdays（收盘后，market_daily 之后半小时）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-log-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Daily update + seal
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/daily_update.sh
          python -m research.pipeline.forward_log verify | tail -8
      - name: Commit forward_log to main
        shell: bash
        run: |
          set -euo pipefail
          git add forward_log/
          if git diff --cached --quiet; then
            echo "No new sealed records (already sealed for this as-of, or no trading day)"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "forward_log: 封存 $(python -c 'import json,pathlib; r=[json.loads(x) for x in pathlib.Path("forward_log/ledger.jsonl").read_text().splitlines() if x.strip()]; print(r[-1]["asof"])')"
          git checkout -- .   # 丢弃 daily_update 对 web/mock/data 等已跟踪文件的改动，只提交 forward_log/
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Post-check (stale / hash)
        if: always()
        run: python -m research.pipeline.forward_log check --max-stale 5 || echo "check exit $? (2 = stale)"
