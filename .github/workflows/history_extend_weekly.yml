name: history_extend_weekly

on:
  schedule:
    - cron: "30 12 * * 5" # UTC 12:30 / 20:30 Asia/Shanghai 每周五盘后自动补扫延续 7 大指数历史回测
  workflow_dispatch:
    inputs:
      opt:
        description: "LPPLS optimizer"
        required: false
        default: "g3"
        type: choice
        options:
          - g3
          - de_trf
          - de
          - tcgrid

concurrency:
  group: history-extend-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch stock-results for latest index price history
        run: git fetch --no-tags --depth=1 origin stock-results || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Extend 7 major indices *_history.json to latest trading day
        env:
          LPPLS_BOX: v2
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          OPT="${{ github.event.inputs.opt || 'g3' }}"
          for sym in sh000001 sh000016 sh000300 sh000905 sh000688 sz399001 sz399006; do
            echo "=== Extending ${sym} (opt=${OPT}) ==="
            python -m research.pipeline.history_extend "${sym}" --opt "${OPT}" --step 5
          done
      - name: Export lightweight overview_latest.json
        env:
          PYTHONUTF8: "1"
        run: python -m research.pipeline.overview_export
      - name: Run PIT & overview tests
        env:
          PYTHONUTF8: "1"
        run: pytest -q tests/test_phase2_fco_cooling.py tests/test_overview_export.py
      - name: Commit & push updated history and overview if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/mock/data/*_history.json web/mock/data/overview_latest.json
          if git diff --cached --quiet; then
            echo "No history updates needed."
            exit 0
          fi
          ASOF="$(python -c 'import json; print(json.load(open("web/mock/data/overview_latest.json"))["asof"])')"
          git commit -m "chore(data): weekly history extend and overview refresh (${ASOF})"
          git push origin HEAD:main
