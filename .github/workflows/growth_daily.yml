name: growth_daily

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - research/data/growth_monitor.py
      - research/data/nt_etf.py
      - research/data/global_macro.py
      - research/data/tencent_sina.py
      - research/data/trading_date.py
      - research/data/freshness.py
      - tests/test_growth_monitor.py
      - tests/test_freshness.py
      - tests/test_market_workflows.py
      - frontend/market.html
      - frontend/app/lppl-data.js
      - frontend/app/od-nav.js
      - scripts/build_site.sh
      - .github/workflows/growth_daily.yml
      - .github/workflows/daily_alert.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: growth-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Fetch previous published growth snapshot
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/growth
          git fetch --no-tags origin stock-results || true
          if git show origin/stock-results:growth/growth_latest.json > out/growth/previous.json 2>/dev/null; then
            echo "path=out/growth/previous.json" >> "$GITHUB_OUTPUT"
          elif [[ -f web/mock/data/growth/growth_latest.json ]]; then
            echo "path=web/mock/data/growth/growth_latest.json" >> "$GITHUB_OUTPUT"
          else
            rm -f out/growth/previous.json
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect growth monitor snapshot
        id: fetch
        env:
          PREVIOUS_PATH: ${{ steps.previous.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="$(python -m research.data.trading_date)"
          args=(--asof "$snapshot_date" --out out/growth)
          if [[ -n "$PREVIOUS_PATH" ]]; then args+=(--previous "$PREVIOUS_PATH"); fi
          python -m research.data.growth_monitor "${args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("out/growth/growth_latest.json").read_text(encoding="utf-8"))
          for item in data["indicators"]:
              print(f"{item['id']}: {item['status']} asof={item['asof']} value={item['value']}")
          print(f"asof={data['asof']}")
          print(f"publishable={str(any(item['asof'] for item in data['indicators']) or Path('out/growth/previous.json').exists()).lower()}")
          PY
          publishable="$(python -c 'import json,pathlib; d=json.load(open("out/growth/growth_latest.json")); print(str(any(i.get("asof") for i in d["indicators"]) or pathlib.Path("out/growth/previous.json").exists()).lower())')"
          echo "asof=$snapshot_date" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"
      - name: Upload growth monitor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-snapshot-${{ github.run_id }}
          path: out/growth/growth_*.json
          if-no-files-found: warn
      - name: Publish to stock-results
        if: github.event_name != 'pull_request' && steps.fetch.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="${{ steps.fetch.outputs.asof }}"
          git fetch --no-tags origin stock-results
          git switch -c growth-publish origin/stock-results
          mkdir -p growth
          cp out/growth/growth_latest.json growth/growth_latest.json
          cp "out/growth/growth_${snapshot_date}.json" "growth/growth_${snapshot_date}.json"
          git add growth/growth_latest.json "growth/growth_${snapshot_date}.json"
          if git diff --cached --quiet; then
            echo "No growth monitor snapshot changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "growth: 发布成长监控 ${snapshot_date}"
          git push origin HEAD:stock-results
          gh workflow run pages.yml --ref main
