name: global_daily

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [global_daily]

permissions:
  contents: write
  actions: write

concurrency:
  group: global-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Restore verified Nasdaq source histories
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/gt/source/US_IXIC
            ${{ runner.temp }}/gt/source/US_NDX
          key: nasdaq-source-v1-${{ runner.os }}-${{ hashFiles('research/data/nasdaq_yfinance.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nasdaq-source-v1-${{ runner.os }}-${{ hashFiles('research/data/nasdaq_yfinance.py') }}-
      - name: Seed existing global history
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gt"
          mkdir -p "$root"
          if git fetch --no-tags origin stock-results; then
            if git cat-file -e FETCH_HEAD:global 2>/dev/null; then
              git archive FETCH_HEAD global | tar -x -C "$root"
            fi
          else
            echo "No stock-results history available to seed"
          fi
      - name: Select asset list
        id: asset-list
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "30 7 * * 1-5" ]]; then
            assets="JP_N225,KR_KOSPI,KR_KOSDAQ,KR_SKHYNIX"
          else
            assets="US_SPX,US_IXIC,US_NDX,US_DJI,US_SOX,JP_N225,KR_KOSPI,KR_KOSDAQ,KR_SKHYNIX,US_MRVL"
          fi
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
      - name: Run global daily pipeline
        run: >-
          python -m research.pipeline.global_terminal
          --root "$RUNNER_TEMP/gt"
          --assets "${{ steps.asset-list.outputs.assets }}"
          --workers 4
          --budget-seconds 900
          --refresh
      - name: Publish to stock-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin stock-results
          git switch -c global-publish FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p global
          cp -a "$RUNNER_TEMP/gt/global/." global/
          git add global
          if git diff --cached --quiet; then
            echo "Global daily results are unchanged"
            exit 0
          fi
          git commit -m "国际指数：发布日更结果"
          delays=(10 15 20 25 30)
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags origin stock-results; then
              if git rebase FETCH_HEAD; then
                if git push origin HEAD:stock-results; then
                  gh workflow run pages.yml --ref main
                  exit 0
                fi
              else
                git rebase --abort || true
              fi
            fi
            if ((attempt < 5)); then
              sleep "${delays[$((attempt - 1))]}"
            fi
          done
          echo "Failed to publish global daily results after five attempts" >&2
          exit 1
