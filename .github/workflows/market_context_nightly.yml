name: market-context-nightly

on:
  schedule:
    # 10:20 UTC = 18:20 Beijing, after the A-share EOD source window.
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
    inputs:
      asof:
        description: "EOD date YYYY-MM-DD (blank = runner date)"
        type: string
        default: ""
      prior_asof:
        description: "Legacy input retained for compatibility; prior session is now resolved from verified calendar"
        type: string
        default: ""
      trading_calendar:
        description: "Verified calendar path; blank uses checked-in 2026 exchange calendar"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: market-context-nightly
  cancel-in-progress: false

jobs:
  refresh:
    # Raw research responses must never become downloadable public artifacts.
    # Public repositories use the separately authorized private backend path.
    # Opt-in and source review remain required even in a private repository.
    if: github.event.repository.private == true && vars.LPPL_EOD_CAPTURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_ASOF: ${{ inputs.asof }}
      INPUT_TRADING_CALENDAR: ${{ inputs.trading_calendar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Locate previous journal from this workflow on main
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const result=await github.rest.actions.listArtifactsForRepo({owner,repo,name:'market-eod-state',per_page:50});
            for(const artifact of result.data.artifacts) {
              if(artifact.expired || artifact.workflow_run?.id===context.runId || artifact.workflow_run?.head_branch!=='main') continue;
              const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:artifact.workflow_run.id});
              if(run.path!=='.github/workflows/market_context_nightly.yml' || run.status!=='completed') continue;
              core.setOutput('run_id',String(run.id));
              core.setOutput('found','true');
              return;
            }
            core.setOutput('found','false');
            core.notice('No prior journal artifact is available; no prior-day data will be invented.');
      - name: Download previous immutable artifact
        if: steps.previous.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: market-eod-state
          path: out/previous-eod
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Verify and restore journal
        if: steps.previous.outputs.found == 'true'
        run: python scripts/restore_market_eod_archive.py --source out/previous-eod/state.sqlite --destination out/market-eod/journal.sqlite
      - name: Capture one EOD attempt with raw responses and durable receipts
        shell: bash
        run: |
          set -euo pipefail
          calendar="${INPUT_TRADING_CALENDAR:-docs/validation/evidence/market-context-p1-20261108/trading_calendar_verified.json}"
          args=(--archive out/market-eod/journal.sqlite --calendar "$calendar" --capture
            --source-policy research/data/market_eod_fetch_policy.json
            --report out/market-eod/report.json)
          if [[ -n "${INPUT_ASOF:-}" ]]; then args+=(--asof "$INPUT_ASOF"); fi
          python scripts/capture_market_eod.py "${args[@]}"
      - name: Finalize and verify transferable state even after interruption
        id: final_state
        if: always()
        run: python -m scripts.finalize_market_eod_archive --source out/market-eod/journal.sqlite --directory out/eod-transfer
      - name: Upload verified journal and failure receipts
        if: always() && steps.final_state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-eod-state
          path: out/eod-transfer/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve diagnostics separately from resumable state
        if: always() && steps.final_state.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-eod-diagnostics-${{ github.run_id }}
          path: out/market-eod/
          if-no-files-found: warn
          retention-days: 30
