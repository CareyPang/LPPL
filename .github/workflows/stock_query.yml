name: stock_query

run-name: ${{ inputs.preview_only && format('preview {0}', inputs.preview_job_id) || format('stock_query {0} {1}', github.event.client_payload.code || inputs.code || 'pr-smoke', github.event.client_payload.job_id || github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      code:
        description: Six-digit A-share code
        type: string
        required: true
      variant:
        description: Stock fitting variant
        type: choice
        options: [stk_lite, stk_full]
        default: stk_lite
      mode:
        description: Current analysis or explicitly requested historical frames
        type: choice
        options: [current, history]
        default: current
      history_weeks:
        description: 0 for current; 1–156 for history (normally 104)
        type: string
        default: "0"
      preview_only:
        description: Isolated PR preview; never writes stock-results or runs Pages
        type: boolean
        default: false
      preview_job_id:
        description: Preview coordinator UUID
        type: string
        default: ""
      preview_requested_at:
        description: Preview coordinator UTC request time
        type: string
        default: ""
      preview_source_sha:
        description: Exact trusted preview branch commit
        type: string
        default: ""
  repository_dispatch:
    types: [stock_query]
  pull_request:
    paths:
      - .github/workflows/stock_query.yml
      - research/pipeline/stock*.py
      - scripts/publish_stock_result.sh
      - tests/test_stock*.py
      - tests/test_publish_stock_result.py

permissions:
  contents: read

concurrency:
  group: stock-query-${{ github.event.client_payload.code || inputs.code || github.ref }}-${{ github.event.client_payload.mode || inputs.mode || 'current' }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_only && github.ref == 'refs/heads/od/stock-async-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PREVIEW_ASSET: ${{ inputs.code }}
      PREVIEW_JOB_ID: ${{ inputs.preview_job_id }}
      PREVIEW_REQUESTED_AT: ${{ inputs.preview_requested_at }}
      PREVIEW_SOURCE_SHA: ${{ inputs.preview_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact preview identity and prohibit historical work
        env:
          PREVIEW_MODE: ${{ inputs.mode }}
          PREVIEW_WEEKS: ${{ inputs.history_weeks }}
        run: |
          python - <<'PY'
          import datetime, os, re, uuid
          assert os.environ['PREVIEW_ASSET'] in {'sh000001','sh600519'}
          assert str(uuid.UUID(os.environ['PREVIEW_JOB_ID'])) == os.environ['PREVIEW_JOB_ID']
          assert re.fullmatch('[0-9a-f]{40}', os.environ['PREVIEW_SOURCE_SHA'])
          assert os.environ['PREVIEW_SOURCE_SHA'] == os.environ['GITHUB_SHA']
          assert os.environ['PREVIEW_MODE'] == 'current' and os.environ['PREVIEW_WEEKS'] == '0'
          when = datetime.datetime.fromisoformat(os.environ['PREVIEW_REQUESTED_AT'].replace('Z','+00:00'))
          age = (datetime.datetime.now(datetime.timezone.utc) - when).total_seconds()
          assert -60 <= age <= 86400
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only the preview fitting dependencies
        run: python -m pip install -r research/requirements-preview.txt
      - name: Compute one real current snapshot
        run: |
          python -m research.pipeline.real_preview_adapter run \
            --asset "$PREVIEW_ASSET" --out output \
            --job-id "$PREVIEW_JOB_ID" --requested-at "$PREVIEW_REQUESTED_AT" \
            --source-sha "$PREVIEW_SOURCE_SHA"
      - name: Preserve isolated UI result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; stored ZIP at level 0
        with:
          name: preview-result-${{ inputs.preview_job_id }}
          path: output/bundle.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve raw responses, hashes and fit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-evidence-${{ inputs.preview_job_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
  prepare:
    if: ${{ !inputs.preview_only }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.validate.outputs.code }}
      variant: ${{ steps.validate.outputs.variant }}
      mode: ${{ steps.validate.outputs.mode }}
      weeks: ${{ steps.validate.outputs.weeks }}
      job_id: ${{ steps.validate.outputs.job_id }}
      requested_at: ${{ steps.validate.outputs.requested_at }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate server job identity and mode
        id: validate
        run: python -m research.pipeline.stock_jobs validate-workflow
      - name: Require the requested commit to belong to trusted main
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

  query:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      query_failed: ${{ steps.compute.outputs.failed }}
    env:
      CODE: ${{ needs.prepare.outputs.code }}
      VARIANT: ${{ needs.prepare.outputs.variant }}
      MODE: ${{ needs.prepare.outputs.mode }}
      WEEKS: ${{ needs.prepare.outputs.weeks }}
      JOB_ID: ${{ needs.prepare.outputs.job_id }}
      REQUESTED_AT: ${{ needs.prepare.outputs.requested_at }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      STOCK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        if: github.event_name != 'pull_request'
        run: python -m pip install -e .
      - name: Install smoke test dependencies
        if: github.event_name == 'pull_request'
        run: python -m pip install -e '.[dev]'
      - name: Offline smoke tests
        if: github.event_name == 'pull_request'
        run: python -m pytest tests/test_stock_jobs.py tests/test_stock_engine.py -m 'not network' -k 'not parallel_and_serial_window_fits_match'
      - name: Restore shared current and history fit cache
        if: github.event_name != 'pull_request'
        id: fit_cache
        uses: actions/cache/restore@v4
        with:
          path: data/stock/${{ needs.prepare.outputs.code }}
          key: stock-fits-v2-${{ needs.prepare.outputs.code }}-${{ needs.prepare.outputs.variant }}-${{ hashFiles('research/lppls/**/*.py', 'research/optim/**/*.py', 'research/features/**/*.py', 'research/pipeline/stock.py', 'research/pipeline/daily.py', 'pyproject.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-fits-v2-${{ needs.prepare.outputs.code }}-${{ needs.prepare.outputs.variant }}-${{ hashFiles('research/lppls/**/*.py', 'research/optim/**/*.py', 'research/features/**/*.py', 'research/pipeline/stock.py', 'research/pipeline/daily.py', 'pyproject.toml') }}-
      - name: Compute only the requested phase
        if: github.event_name != 'pull_request'
        id: compute
        shell: bash
        run: |
          set +e
          mkdir -p out/stock
          python -m research.pipeline.stock "$CODE" \
            --variant "$VARIANT" --phase "$MODE" --history-weeks "$WEEKS" \
            --job-id "$JOB_ID" --requested-at "$REQUESTED_AT" --source-sha "$SOURCE_SHA" \
            --procs 4 --cache-dir data/stock --out out/stock
          result=$?
          set -e
          if [[ -d "data/stock/$CODE" ]]; then echo "cache_ready=true" >> "$GITHUB_OUTPUT"; fi
          if (( result == 0 )); then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            python -m research.pipeline.stock_jobs error
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save fits after current or history computation
        if: always() && github.event_name != 'pull_request' && steps.compute.outputs.cache_ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/stock/${{ needs.prepare.outputs.code }}
          key: ${{ steps.fit_cache.outputs.cache-primary-key }}
      - name: Preserve result or public error
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stock-result-${{ needs.prepare.outputs.job_id }}
          path: out/stock/
          if-no-files-found: error
      - name: Mark failed computation
        if: steps.compute.outputs.failed == 'true'
        run: exit 1

  publish:
    needs: [prepare, query]
    if: >-
      always() && !cancelled() && !inputs.preview_only && github.event_name != 'pull_request' &&
      needs.prepare.result == 'success' &&
      (needs.query.result == 'success' || needs.query.outputs.query_failed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      CODE: ${{ needs.prepare.outputs.code }}
      VARIANT: ${{ needs.prepare.outputs.variant }}
      HISTORY_WEEKS: ${{ needs.prepare.outputs.weeks }}
      STOCK_RESULT_DIR: out/stock
      STOCK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: stock-result-${{ needs.prepare.outputs.job_id }}
          path: out/stock
      - name: Publish immutable job result and compatible latest pointers
        run: bash scripts/publish_stock_result.sh
      - name: Refresh static fallback (API result is already readable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Preserve failed job status after publishing its error
        if: needs.query.outputs.query_failed == 'true'
        run: exit 1
