name: index_replay
run-name: index_replay ${{ github.event.client_payload.sym || inputs.sym || 'pr' }} ${{ github.event.client_payload.asof || inputs.asof || '' }}

on:
  workflow_dispatch:
    inputs:
      sym:
        description: Index symbol (sh000001 / sh000016 / sh000300 / sh000905 / sh000688 / sz399001 / sz399006)
        type: string
        required: true
      asof:
        description: As-of trading day, YYYY-MM-DD (only data on or before this day is used)
        type: string
        required: true
      job_id:
        description: Optional request id from the Worker
        type: string
        default: ""
  repository_dispatch:
    types: [index_replay]
  pull_request:
    paths:
      - .github/workflows/index_replay.yml
      - research/pipeline/daily.py

permissions:
  contents: write

concurrency:
  group: index-replay-${{ github.event.client_payload.sym || inputs.sym || github.ref }}-${{ github.event.client_payload.asof || inputs.asof || 'pr' }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYM: ${{ github.event.client_payload.sym || inputs.sym || 'sh000001' }}
      ASOF: ${{ github.event.client_payload.asof || inputs.asof || '2015-06-12' }}
      JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          case "$SYM" in
            sh000001|sh000016|sh000300|sh000905|sh000688|sz399001|sz399006) ;;
            *) echo "::error::unsupported sym ${SYM}"; exit 1 ;;
          esac
          [[ "$ASOF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::asof must be YYYY-MM-DD"; exit 1; }
          [[ "$JOB_ID" =~ ^[0-9a-zA-Z-]{0,64}$ ]] || { echo "::error::bad job_id"; exit 1; }
          if [[ "$ASOF" > "$(date -u -d '+8 hours' +%F)" ]]; then echo "::error::asof is in the future"; exit 1; fi
          if [[ "$ASOF" < "2005-01-04" ]]; then echo "::error::asof before 2005 has too little history"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run as-of index fit
        id: run
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set +e
          mkdir -p out/index
          LPPLS_BOX=v2 python -m research.pipeline.daily "$SYM" --asof "$ASOF" --out out/index 2>&1 | tee out/index/run.log
          result=${PIPESTATUS[0]}
          set -e
          if (( result == 0 )) && [[ -f "out/index/${SYM}_${ASOF}.json" ]]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            msg="$(grep -m1 -E 'Error|错误|不是交易日' out/index/run.log | tail -c 300 || true)"
            python - "$SYM" "$ASOF" "$JOB_ID" "$msg" <<'PY'
          import json, sys, datetime as dt
          sym, asof, job_id, msg = sys.argv[1:5]
          permanent = "不是交易日" in msg
          json.dump({"status": "failed", "sym": sym, "asof": asof, "job_id": job_id or None,
                     "error": msg or "计算失败", "permanent": permanent,
                     "failed_at": dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")},
                    open(f"out/index/{sym}_{asof}.json", "w"), ensure_ascii=False)
          PY
          fi
      - name: Publish to stock-results
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin stock-results
          git switch -c index-replay-publish origin/stock-results
          mkdir -p index/replay
          target="index/replay/${SYM}_${ASOF}.json"
          cp "out/index/${SYM}_${ASOF}.json" "$target"
          git add "$target"
          if git diff --cached --quiet; then
            echo "Replay result unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "index replay: ${SYM} asof ${ASOF}${JOB_ID:+ (${JOB_ID})}"
          for attempt in 1 2 3; do
            if git push origin HEAD:stock-results; then exit 0; fi
            git fetch --no-tags origin stock-results
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              rebase origin/stock-results
          done
          echo "::error::failed to push replay result"; exit 1
