<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>临界点 2.0 · 个股入口（映射到所属指数）</title>
<style>:root{--bg:#0e1116;--panel:#161b22;--line:#2a313b;--fg:#e6edf3;--mute:#8b949e;--red:#f85149;--amb:#d29922;--none:#484f58}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:24px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}.sub{color:var(--mute);font-size:12px}.muted{color:var(--mute)}
input{background:#0e1116;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:15px;width:140px}button{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--none);color:var(--none);margin-left:6px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500}
.warn{border-left:3px solid var(--amb);padding-left:10px;color:var(--mute);font-size:12px}iframe{width:100%;height:1600px;border:0;border-radius:10px}
canvas{width:100%;height:300px;display:block;margin-top:10px}.rc{border-color:var(--amb);color:var(--amb)}.leg{font-size:12px;color:var(--mute);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;vertical-align:-1px}
.dip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.dip-card{min-width:0;background:#11161d;border:1px solid var(--line);border-radius:8px;padding:12px}.dip-card h4{margin:0 0 8px}.dip-wide{grid-column:1/-1}.dip-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.dip-values div{border-bottom:1px solid var(--line);padding:4px 0}.dip-label{display:block;color:var(--mute);font-size:11px}.dip-value{font-variant-numeric:tabular-nums}.dip-scroll{overflow-x:auto}.dip-table{min-width:700px;font-size:11px}.dip-table td,.dip-table th{padding:5px}.dip-quantile{width:100%;min-width:0;table-layout:fixed;font-size:10px}.dip-quantile td,.dip-quantile th{padding:4px 3px;overflow-wrap:anywhere}.dip-quantile th:first-child{width:34%}.dip-pool{min-width:0;margin:10px 0 14px}.dip-pool-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}.dip-prob-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:11px;margin-top:3px}.dip-disclaimer{color:var(--mute);font-size:11px;margin:8px 0 0}.dip-env-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dip-env-item{border:1px solid var(--line);border-radius:6px;padding:8px}.dip-badge{color:var(--amb);font-size:12px;margin:3px 0}
@media(max-width:600px){.dip-grid,.dip-env-grid{grid-template-columns:1fr}.dip-wide{grid-column:auto}.dip-values{grid-template-columns:repeat(2,minmax(0,1fr))}.dip-card{padding:10px}.dip-table{min-width:640px}}
</style><style>.dip-anomalies{margin:2px 0 0;padding-left:18px;font-size:11px}.dip-anomalies li{margin:2px 0}.dip-hit-table{min-width:0;width:100%;table-layout:fixed;font-size:10px}.dip-hit-table td,.dip-hit-table th{padding:4px 2px;overflow-wrap:anywhere}.dip-hit-table th:nth-child(1){width:12%}.dip-hit-table th:nth-child(2){width:24%}.dip-hit-table th:nth-child(6){width:20%}</style>
<script>window.LPPL_QUERY_API = 'https://lppl-stock-query.careypang.workers.dev';</script><script src="theme.js"></script></head><body><div class="wrap">
<div class="card"><h2 style="margin:0 0 8px">个股输入 → 所属指数的顶部风险</h2>
<input id="code" placeholder="6 位代码，如 600519" maxlength="6"> <button id="go">查看</button>
<div class="sub" style="margin-top:8px">个股层面的 LPPLS 置信度/排名在开发段横截面（100 只 PIT 成分股）中<b>无预测信息</b>，产品不对个股本身给泡沫结论；这里只显示它所属指数的风险状态，个股自身的描述性曲线留在图表工作台并标"无证据"。</div></div>
<div class="card" id="map" style="display:none"><table><tbody id="rows"></tbody></table><p class="warn" style="margin:10px 0 0" id="note"></p></div>
<div class="card" id="own" style="display:none"></div>
<iframe id="frame" style="display:none"></iframe>
</div><script>
const NAMES={sh000001:'上证指数',sh000016:'上证50',sh000300:'沪深300',sh000905:'中证500',sz399001:'深证成指',sz399006:'创业板指'};
let U=null, C=null;
const QUERY_API=(window.LPPL_QUERY_API||'').replace(/\/$/,'');
async function loadJ(f){ try{ return await (await fetch(f,{cache:'no-store'})).json(); }catch(e){ return null; } }
async function resolve(c){
  if(!C){ C=(await loadJ('mock/data/universe_current.json'))||{indices:{},source_date:{}}; }
  if(!U){ U=(await loadJ('mock/data/universe_csi300.json'))||{codes:[]}; }
  const r=[]; let primary=null;
  for(const [sym,label] of [['sh000016','上证50'],['sh000300','沪深300'],['sh000905','中证500']]){
    if((C.indices[sym]||[]).includes(c)){ r.push([label+' 成分（中证公司最近公布 '+(C.source_date[sym]||'')+'，非 PIT）',sym]); primary=primary||sym; }
  }
  if(!primary && U.codes.includes(c)){ r.push(['沪深300 成分（PIT 快照 '+U.snapshot+'，可能已调出）','sh000300']); primary='sh000300'; }
  if(/^30/.test(c)){ r.push(['创业板（按代码段）','sz399006']); primary=primary||'sz399006'; }
  else if(/^68/.test(c)){ r.push(['科创板（科创50 不在日更 6 指数内，退回上证指数）','sh000001']); primary=primary||'sh000001'; }
  else if(/^(60|90)/.test(c)){ r.push(['沪市主板（按代码段）','sh000001']); primary=primary||'sh000001'; }
  else if(/^(00|20)/.test(c)){ r.push(['深市主板（按代码段）','sz399001']); primary=primary||'sz399001'; }
  return {rows:r, primary};
}
async function go(){
  const c=document.getElementById('code').value.trim();
  if(!/^\d{6}$/.test(c)){ alert('请输入 6 位代码'); return; }
  const {rows,primary}=await resolve(c);
  document.getElementById('map').style.display='';
  document.getElementById('rows').innerHTML=`<tr><th style="width:28%">个股</th><td>${c}</td></tr>`+rows.map(x=>`<tr><th>${x[0]}</th><td>${NAMES[x[1]]} ${x[1]} <a class="sub" href="dashboard.html?sym=${x[1]}_latest" style="color:#58a6ff">在仪表盘中打开</a></td></tr>`).join('')+`<tr><th>个股自身 LPPLS</th><td class="muted">见下方按需计算结果 <span class="badge rc">research_candidate</span></td></tr>`;
  document.getElementById('note').textContent='上证50/沪深300/中证500 成分来自中证指数公司最近公布名单（非 PIT，调样后以官网为准）；其余按代码段推断。指数风险状态的证据等级以仪表盘各 badge 为准。';
  const f=document.getElementById('frame'); f.style.display=''; f.src=`dashboard.html?sym=${primary}_latest`;
  own(c);
}

const SC=['2-4w','1-3m','3-6m','6-12m','12-24m','2-6y'], SCL={'2-4w':'2–4周','1-3m':'1–3月','3-6m':'3–6月','6-12m':'6–12月','12-24m':'12–24月','2-6y':'2–6年'};
const ACT='https://github.com/CareyPang/LPPL/actions/workflows/stock_query.yml';
const esc=x=>String(x??'—').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';
const activeQueries=new Set();
const ownHead='<h3 style="margin:0 0 6px">个股自身 LPPLS（按需计算）<span class="badge rc">research_candidate</span></h3>';
async function workerJSON(path,options){
  const r=await fetch(QUERY_API+path,options);
  if(r.status===404) return null;
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(data?.error||'公开查询失败（HTTP '+r.status+'）');
  return data;
}
async function remoteStock(c,kind='latest'){
  return workerJSON('/result?code='+encodeURIComponent(c)+'&kind='+encodeURIComponent(kind));
}
function elapsed(start){
  const seconds=Math.floor((Date.now()-start)/1000);
  return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function showQueryProgress(c,label,start){
  const el=document.getElementById('own');
  el.style.display='';
  el.innerHTML=ownHead+`<p class="muted">${esc(c)}：${esc(label)}（已等待 ${elapsed(start)}）</p>`;
}
function showQueryFailure(c,message,runUrl){
  const el=document.getElementById('own');
  el.style.display='';
  const link=runUrl?`<br><a href="${esc(runUrl)}" target="_blank" rel="noopener" style="color:#58a6ff">查看运行日志</a>`:'';
  el.innerHTML=ownHead+`<p class="warn">${esc(c)}：${esc(message)}${link}</p>`;
}
function showHistoryNotice(message,runUrl){
  const el=document.getElementById('history-status');
  if(!el) return;
  const link=runUrl?`<br><a href="${esc(runUrl)}" target="_blank" rel="noopener" style="color:#58a6ff">查看运行日志</a>`:'';
  el.innerHTML=esc(message)+link;
  el.style.display='';
}
const dipNum=v=>v==null||!Number.isFinite(Number(v))?'—':String(Number(v));
const dipPct=v=>v==null||!Number.isFinite(Number(v))?'—':(Number(v)*100).toFixed(1)+'%';
const dipFixed=(v,digits=2)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(digits);
const dipSigned=(v,digits=2)=>v==null||!Number.isFinite(Number(v))?'—':(Number(v)>0?'+':'')+Number(v).toFixed(digits);
const dipPctChange=v=>v==null||!Number.isFinite(Number(v))?null:Number(v)*100;
const dipShareChange=(x,days)=>`${dipSigned(x[`change_${days}d_shares_yi`])} 亿份（${dipSigned(dipPctChange(x[`change_${days}d`]),1)}%）`;
function dipStatBlock(items){
  return `<div class="dip-values">${items.map(([label,value])=>`<div><span class="dip-label">${esc(label)}</span><span class="dip-value">${esc(value)}</span></div>`).join('')}</div>`;
}
function dipSimilarPools(similar){
  const metrics=[['r60','60日后收益'],['r120','120日后收益'],['r250','250日后收益'],['mdd120','120日内最深再跌'],['up120','120日内最高反弹']];
  return [['full','全市场'],['industry','同行业'],['excl1516','剔除 2015–16 年（牛熊极端年）']].map(([key,label])=>{
    const s=similar?.[key]||null;
    const counts=s||(key==='industry'?(similar?.industry_counts||{}):{});
    const n=counts?.n, delisted=counts?.n_delisted;
    const quantiles=s?.q;
    const rows=metrics.map(([metric,title])=>`<tr><th>${title}</th>${[0,1,2,3,4].map(i=>`<td>${dipPct(quantiles?.[metric]?.[i])}</td>`).join('')}<td>${dipNum(s?.n_outcome?.[metric])}</td></tr>`).join('');
    const p30=dipPct(s?.p_up120_ge30),p50=dipPct(s?.p_up120_ge50);
    const unavailable=key==='industry'&&!s?'同行业样本 <30，不单独统计':'';
    return `<section class="dip-pool"><div class="dip-pool-head"><b>${label}</b><span>${dipNum(n)} 个事件，其中退市股 ${dipNum(delisted)} 个</span></div>${s?`<div class="muted">较差 10%：只有 10% 的事件比这更差；较好 10%：只有 10% 的事件比这更好。</div><table class="dip-quantile"><thead><tr><th>指标</th><th>较差 10%</th><th>25%</th><th>中位数</th><th>75%</th><th>较好 10%</th><th>样本数</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="muted">${unavailable||'—'}</div>`}<div class="dip-prob-row"><span>120 日内最高反弹 ≥30%：${p30}</span><span>≥50%：${p50}</span></div></section>`;
  }).join('');
}
function dipHitRows(dip){
  return ['fh60','fh120'].map(key=>{
    const item=dip.first_hit?.[key]||{};
    const [term,bounds]=key==='fh60'?['60 日','+15% / −15%']:['120 日','+30% / −20%'];
    return ['hist','rw'].map(kind=>{
      const value=item[kind];
      return `<tr><td>${term}</td><td>${bounds}</td><td>${kind==='hist'?'历史类似事件':'随机波动对照'}</td><td>${dipPct(value?.U)}</td><td>${dipPct(value?.L)}</td><td>${dipPct(value?.none)}</td><td>${kind==='hist'?dipNum(value?.n):'模拟 20000 条'}</td></tr>`;
    }).join('');
  }).join('');
}
function dipEnvironmentHtml(env){
  if(!env) return '<p class="muted">暂无</p><p class="dip-disclaimer">ETF 份额增加只说明有资金申购，不能确定是谁买的。期权数据反映的是指数情绪，不是这只股票。历史分位，不是预测。</p>';
  const names={510300:'沪深300 ETF',588000:'科创50 ETF',510050:'上证50 ETF',510500:'中证500 ETF'};
  const shares=env.shares||{}, options=env.options||{};
  const shareItems=Object.keys(names).map(code=>{
    const x=shares[code]||{};
    const dates=(x.mad_subscription_dates||[]).slice(-3).map(v=>`<li>${esc(v.date)}：${dipSigned(v.change==null?null:Number(v.change)/1e4)} 亿份，偏离常态 ${dipFixed(v.robust_z,1)} 倍</li>`).join('')||'<li>—</li>';
    const twentyDay=`${dipSigned(x.change_20d_shares_yi)} 亿份（${dipSigned(dipPctChange(x.change_20d),1)}%）`;
    return `<div class="dip-env-item"><b>${names[code]}</b><p>近 20 个交易日份额 ${twentyDay}。</p>${dipStatBlock([['最新总份额',`${dipFixed(x.latest_shares_yi)} 亿份`],['5日份额变化',dipShareChange(x,5)],['20日份额变化',dipShareChange(x,20)],['60日份额变化',dipShareChange(x,60)]])}<div class="dip-label">样本：${dipNum(x.n_days)} 日；最新日 ${esc(x.latest_date||'—')}；20日分母日 ${esc(x.change_20d_from||'—')}</div><div class="dip-label">单日申购明显偏大的日子（最近 3 次）</div><ul class="dip-anomalies">${dates}</ul></div>`;
  }).join('');
  const optionItems=Object.keys(names).map(code=>{
    const x=options[code]||{};
    return `<div class="dip-env-item"><b>${names[code]}</b>${dipStatBlock([['隐含波动率（平值）',dipPct(x.iv_atm)],['隐含波动 − 近 20 日实际波动',dipPct(x.iv_minus_rv20)],['认沽比认购贵（偏度）',dipPct(x.put_call_skew)],['认沽/认购成交量比',dipFixed(x.put_call_volume,2)],['隐含波动在历史中的位置',`${dipPct(x.iv_pct_rv_history)} 分位`]])}<div class="dip-label">样本：${dipNum(x.n)} 个期权合约；${esc(x.error||'指数/ETF 环境，非个股期权')}</div></div>`;
  }).join('');
  return `<div class="sub">截止 ${esc(env.asof||'—')}</div><h5>宽基 ETF 份额变化（资金申购/赎回代理）</h5><div class="dip-env-grid">${shareItems}</div><p class="dip-disclaimer">ETF 份额增加只说明有资金申购，不能确定是谁买的。历史分位，不是预测。</p><h5>ETF 期权：市场情绪（指数/ETF 环境，非个股期权）</h5><div class="dip-env-grid">${optionItems}</div><p class="dip-disclaimer">期权数据反映的是指数情绪，不是这只股票。历史分位，不是预测。</p>`;
}
async function loadDipEnvironment(){
  const el=document.getElementById('dip-env-data');
  if(!el) return;
  const env=await loadJ('mock/data/stock/_dip_env.json');
  el.innerHTML=dipEnvironmentHtml(env);
}
function renderDipPanel(dip){
  const host=document.getElementById('dip-panel');
  if(!host) return;
  if(!dip){host.innerHTML='<h3>抄底面板</h3><p class="muted">—</p><p class="dip-disclaimer">历史分位，不是预测。</p>';return;}
  const s=dip.state||{}, lib=dip.lib||{}, verdict=dip.oos||{};
  const verdictLabel=verdict.label||'样本外未通过，仅描述';
  const h1Badge=verdict.items?.H1==='failed'?`<div class="dip-badge">${esc(verdictLabel)}</div>`:'';
  const h2Badge=verdict.items?.H2==='failed'?`<div class="dip-badge">${esc(verdictLabel)}</div>`:'';
  const h3Badge=verdict.items?.H3==='pending'?'<div class="dip-badge">样本外检验未做</div>':'';
  const similar=dip.similar||{};
  const reading=similar.full||{};
  const fullQuantiles=reading.q||{};
  const structureReading=`从 ${s.peak_date||'—'} 的高点（此前上涨 ${dipPct(s.runup)}）已下跌 ${dipPct(s.dd)}，历时 ${dipNum(s.td_since_peak)} 个交易日；最近低点在 ${s.low_date||'—'}，之后反弹 ${dipPct(s.bounce_from_low)}。`;
  const depthText=dip.depth_bucket==null?'—':dipPct(Math.abs(Number(dip.depth_bucket)));
  const structureRule=dip.in_structure===true?`符合‘大涨后深跌’条件，下面按跌幅 ≥${depthText} 的历史事件对照。`:'不符合‘大涨后深跌’条件（要求此前涨 ≥200%、跌 ≥40%、距高点 ≤250 个交易日），下面不做相似事件对照。';
  const similarReading=`全市场 ${dipNum(reading.n)} 个类似事件中，120 个交易日后收益中位数 ${dipPct(fullQuantiles.r120?.[2])}，一半落在 ${dipPct(fullQuantiles.r120?.[1])} 到 ${dipPct(fullQuantiles.r120?.[3])} 之间；期间最深再跌中位数 ${dipPct(fullQuantiles.mdd120?.[2])}；120 日内最高反弹达到 30% 的占 ${dipPct(reading.p_up120_ge30)}。`;
  const hit=dip.first_hit||{}, hist60=hit.fh60?.hist||{}, rw60=hit.fh60?.rw||{};
  const hitReading=`历史上类似情况，60 个交易日内先涨 15% 的占 ${dipPct(hist60.U)}，先跌 15% 的占 ${dipPct(hist60.L)}；如果股价只是随机波动（波动率按当前水平），这两个数是 ${dipPct(rw60.U)} 和 ${dipPct(rw60.L)}。`;
  const regime=dip.regime||{};
  const regimeReading=`按周收益估计，现在处于高波动阶段的概率是 ${dipPct(regime.p_hi_filtered)}（高波动阶段年化波动 ${dipPct(regime.hi_vol_ann)}，低波动阶段 ${dipPct(regime.lo_vol_ann)}）。`;
  host.innerHTML=`<h3 style="margin:16px 0 6px">抄底面板</h3><p>只描述历史上类似情况后来怎样，不是预测，也不构成投资建议。</p><div class="sub">事件库 ${esc(lib.version||'—')} · 数据截至 ${esc(lib.cutoff||'—')} · 共 ${dipNum(lib.n_events)} 个事件</div>
  <div class="dip-grid">
  <section class="dip-card"><h4>现在跌到哪了？</h4><p>${structureReading}<br>${structureRule}</p>${dipStatBlock([['截止日期',s.asof||'—'],['收盘价（后复权）',s.close==null?'—':`${dipFixed(s.close)}（后复权）`],['是否符合条件',dip.in_structure===true?'是':dip.in_structure===false?'否':'—'],['对照档',dip.depth_bucket==null?'—':`跌幅 ≥${depthText}`],['前高日期',s.peak_date||'—'],['高点前涨幅',dipPct(s.runup)],['距高点跌幅',dipPct(s.dd)],['距高点交易日',dipNum(s.td_since_peak)],['低点日期',s.low_date||'—'],['距最近低点反弹',dipPct(s.bounce_from_low)],['20日收益',dipPct(s.ret20)],['60日收益',dipPct(s.ret60)],['近 20 日波动（年化）',dipPct(s.rv20)],['波动在近 5 年中的位置',`${dipPct(s.rv20_pct5y)} 分位`],['日波动估计',dipPct(s.vol_d)],['距下方成交密集区',s.well_dist_below==null?'下方没有成交密集区':dipPct(s.well_dist_below)]])}<div class="dip-disclaimer">基于最近 500 个交易日。历史分位，不是预测。</div></section>
    <section class="dip-card"><h4>历史上类似的股票，后来怎样？</h4>${h1Badge}<p>${similarReading}</p>${dipSimilarPools(similar)}<p class="dip-disclaimer">‘最高反弹’按事后最高点计算，实际很难恰好卖在最高点，所以要和‘120日后收益’一起看。历史分位，不是预测。</p></section>
    <section class="dip-card"><h4>先涨还是先跌？</h4>${h2Badge}<p>${hitReading}</p><div class="dip-scroll"><table class="dip-hit-table"><thead><tr><th>期限</th><th>上沿/下沿</th><th>来源</th><th>先碰上沿</th><th>先碰下沿</th><th>都没碰到</th><th>样本数</th></tr></thead><tbody>${dipHitRows(dip)}</tbody></table></div><div class="dip-disclaimer">2019 年以后的样本外检验中，历史比例没有稳定地好过随机对照，不能当作预测。历史分位，不是预测。</div></section>
    <section class="dip-card"><h4>现在是高波动阶段吗？</h4>${h3Badge}<p>${regimeReading}</p>${dipStatBlock([['处于高波动阶段的概率',dipPct(regime.p_hi_filtered)],['高波动阶段的年化波动',dipPct(regime.hi_vol_ann)],['低波动阶段的年化波动',dipPct(regime.lo_vol_ann)],['高波动阶段的平均周收益',dipPct(regime.hi_mean_wk)],['低波动阶段的平均周收益',dipPct(regime.lo_mean_wk)],['使用周数',dipNum(regime.weeks)]])}<div class="dip-disclaimer">高波动不等于下跌：它只说明价格摆动大。概率只用截至当周的数据计算，不用未来数据。历史分位，不是预测。</div></section>
    <section class="dip-card dip-wide"><h4>大盘资金和情绪怎样？</h4><div id="dip-env-data" class="muted">加载中…</div></section>
  </div>`;
  loadDipEnvironment();
}
async function runQuery(c,idx,br){
  if(activeQueries.has(c)) return;
  activeQueries.add(c);
  const started=Date.now();
  const currentDeadline=started+10*60*1000;
  const totalDeadline=started+40*60*1000;
  try{
    showQueryProgress(c,'排队中',started);
    const queued=await fetch(QUERY_API+'/query',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:c})
    });
    const queuedBody=await queued.json().catch(()=>null);
    if(!queued.ok) throw new Error(queuedBody?.error||'提交查询失败（HTTP '+queued.status+'）');
    const since=queuedBody?.since;
    const sinceTime=Date.parse(since);
    if(typeof since!=='string'||!Number.isFinite(sinceTime)) throw new Error('查询服务未返回有效的任务时间。');
    let currentResult=null;
    while(Date.now()<currentDeadline){
      try{
        const result=await remoteStock(c,'latest');
        if(result&&Number.isFinite(Date.parse(result.generated_at))&&Date.parse(result.generated_at)>=sinceTime-60000){
          currentResult=result;
          break;
        }
      }catch{}
      let state;
      try{
        state=await workerJSON('/status?code='+encodeURIComponent(c)+'&since='+encodeURIComponent(since));
      }catch(e){
        showQueryProgress(c,'状态暂不可用，继续查询',started);
        state=null;
      }
      if(state?.status==='completed'&&state.conclusion!=='success'){
        const error=await remoteStock(c,'error').catch(()=>null);
        showQueryFailure(c,error?.error||'计算失败。',error?.run_url||state.run_url);
        return;
      }
      if(state) showQueryProgress(c,state.status==='in_progress'?'计算中':'排队中',started);
      const remaining=currentDeadline-Date.now();
      if(remaining>0) await new Promise(resolve=>setTimeout(resolve,Math.min(10000,remaining)));
    }
    if(!currentResult){
      showQueryFailure(c,'当前结果超过 10 分钟未返回，请稍后刷新。');
      return;
    }
    renderStock(c,currentResult,null,idx,null,br);
    showHistoryNotice('历史回测（104 周）后台计算中，约 15 分钟，完成后自动补上；可以先看当前结果。');
    while(Date.now()<totalDeadline){
      const remaining=totalDeadline-Date.now();
      if(remaining<=0) break;
      await new Promise(resolve=>setTimeout(resolve,Math.min(10000,remaining)));
      let state;
      try{
        state=await workerJSON('/status?code='+encodeURIComponent(c)+'&since='+encodeURIComponent(since));
      }catch{
        continue;
      }
      if(state?.status!=='completed') continue;
      if(state.conclusion==='success'){
        let latest=null, history=null;
        try{
          [latest,history]=await Promise.all([remoteStock(c,'latest'),remoteStock(c,'history')]);
        }catch{}
        if(latest&&history){
          renderStock(c,latest,history,idx,null,br);
          return;
        }
        continue;
      }
      showHistoryNotice('历史回测失败，当前结果不受影响',state.run_url);
      return;
    }
    showHistoryNotice('历史回测仍在计算，请稍后刷新页面');
  }catch(e){
    showQueryFailure(c,e.message||'公开查询失败。');
  }finally{
    activeQueries.delete(c);
  }
}
async function own(c,force=false){
  const el=document.getElementById('own'); el.style.display='';
  el.innerHTML='<div class="sub">读取按需计算结果…</div>';
  let breadthIndex=null;
  if((C.indices.sh000300||[]).includes(c)) breadthIndex='sh000300';
  else if((C.indices.sh000905||[]).includes(c)) breadthIndex='sh000905';
  else if(U.codes.includes(c)) breadthIndex='sh000300';
  const breadthFile=breadthIndex?`mock/data/stock/breadth_${breadthIndex}.json`:null;
  const [localD,localH,idx,err,br]=await Promise.all([loadJ(`mock/data/stock/${c}.json`),loadJ(`mock/data/stock/${c}_history.json`),loadJ('mock/data/stock/index.json'),loadJ(`mock/data/stock/${c}_error.json`),breadthFile?loadJ(breadthFile):Promise.resolve(null)]);
  let d=localD, h=localH;
  if(QUERY_API&&force){ await runQuery(c,idx,br); return; }
  if(QUERY_API&&!d){
    try{
      d=await remoteStock(c,'latest');
      if(d) h=await remoteStock(c,'history');
    }catch{}
    if(!d){ await runQuery(c,idx,br); return; }
  }
  renderStock(c,d,h,idx,err,br);
}
function renderStock(c,d,h,idx,err,br){
  const el=document.getElementById('own'); el.style.display='';
  const brTxt=br&&br.n?`<p class="sub">成分股广度（${esc(br.universe_note||br.index)}，截止 ${esc(br.asof)}${br.asof_consistent===false?'，截止日不一致':''}）：6–12月/12–24月有合格拟合 ${br.n_qualified_fit_dev}/${br.n}（${pct(br.share_qualified_fit_dev)}）；置信度≥0.5 ${br.n_confidence_ge_0_5_dev}/${br.n}。n=${br.n}，描述性统计，不是预测，不进模型。</p>`:'';
  const ent=(idx&&idx[c])||(d&&d.run_url?{run_url:d.run_url}:null);
  const head=ownHead;
  if(!d){
    el.innerHTML=head+(err?`<p class="warn">最近一次计算失败（${esc(err.generated_at)}）：<br><code>${esc(err.error).replace(/\n/g,'<br>')}</code><br><a href="${esc(err.run_url)}" style="color:#58a6ff">查看运行日志</a></p>`:'')+
      `<p class="muted">该代码还没有计算结果。到 <a href="${ACT}" style="color:#58a6ff">GitHub Actions · stock_query</a> 点 “Run workflow”，填代码 ${c}，约 1–5 分钟后刷新本页。</p>`;
    return;
  }
  const m=d.stock_meta||{}, t=d.top||{}, ind=t.indicators||{}, b=t.bubble||{};
  const fitTxt=x=>{const cf=x.confidence||{}; if(x.n_windows==null) return '未计算'; return (cf.standard||0)>0?'有合格拟合':'无合格拟合';};
  const rows=SC.map(k=>{const x=ind[k]||{}, ev=(t.lppls_confidence?.scale_evidence||{})[k];
    return `<tr><td>${SCL[k]}</td><td>${x.n_windows??'—'}</td><td>${fitTxt(x)}</td><td class="sub">${esc(x.signal_status)}</td><td class="sub">${esc(ev)}</td></tr>`}).join('');
  const st=m.status==='eligible'?'':`<span class="badge" style="border-color:var(--red);color:var(--red)">${esc(m.status)}</span>`;
  el.innerHTML=head+
    `<div class="sub">${esc(d.name)} ${esc(d.symbol)} · 截止 ${esc(d.asof)} ${QUERY_API?'<button id="requery" type="button">重新计算</button>':''} · ${esc(m.variant)} · ${esc(d.data_version)}${ent?` · 计算于 ${esc(ent.generated_at?.slice(0,16).replace('T',' '))} UTC <a href="${esc(ent.run_url)}" style="color:#58a6ff">日志</a>`:''} ${st}</div>
    <p class="warn">${esc(m.note)}。${esc(m.eligibility_note)}${m.st?'；ST':''}${m.degenerate?'；截止日为一字板/停牌':''}。开发段横截面里个股置信度没有预测信息，按 dev_only 规则不显示置信度数值，只显示有无合格拟合。</p>
    <div style="overflow-x:auto"><table><thead><tr><th>尺度</th><th>窗口数</th><th>standard 集</th><th>状态</th><th>尺度证据</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">当前泡沫段：起点 ${esc(b.start)} · 持续 ${esc(b.duration_days)} 天 · 最长尺度 ${esc(SCL[b.scale]||b.scale)}· 风险窗口 ${t.window?.start?esc(t.window.start)+' → '+esc(t.window.end):'无（'+esc(t.window?.rule)+'）'}</div>
    ${brTxt}
    <p class="warn" id="history-status" style="display:none"></p>
    <div id="dip-panel"></div>
    <canvas id="oc"></canvas>
    <div class="leg"><i style="background:#8b949e"></i>后复权收盘<i style="background:#d29922"></i>该截止日 6–12月/12–24月 有合格拟合（任一集合）<i style="background:rgba(248,81,73,.5)"></i>当时情景区间 q20–q80（未校准，仅供参考）<i style="background:#58a6ff"></i>事后确认顶</div>`;
  const requery=document.getElementById('requery');
  if(requery) requery.onclick=()=>own(c,true);
  draw(d,h);
  renderDipPanel(d.dip);
}
function draw(d,h){
  const cv=document.getElementById('oc'), dpr=devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const ph=d.price_history||{}, ds=ph.dates||[], cl=ph.close||[]; if(!ds.length) return;
  const L=50,R=40,T=10,B=22, t0=Date.parse(ds[0]), t1=Date.parse(ds[ds.length-1]);
  const x=s=>L+(Date.parse(s)-t0)/(t1-t0||1)*(W-L-R);
  const lo=Math.min(...cl), hi=Math.max(...cl), y=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B), yc=v=>T+(1-v)*(H-T-B);
  g.font='11px sans-serif'; g.fillStyle='#8b949e'; g.strokeStyle='#2a313b';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4, yy=y(v); g.beginPath(); g.moveTo(L,yy); g.lineTo(W-R,yy); g.stroke(); g.fillText(v.toFixed(0),2,yy+4);}
  (W<600?[0,.5,1]:[0,.25,.5,.75,1]).forEach(f=>{const s=ds[Math.min(ds.length-1,Math.round(f*(ds.length-1)))]; g.fillText(s.slice(0,7),Math.min(W-R-40,x(s)-18),H-6);});
  const fr=(h&&h.frames)||[];
  fr.forEach(f=>(f.scenarios||[]).forEach(sc=>{ if(!sc.q20_date||Date.parse(f.asof)<t0) return; const a=x(f.asof<sc.q20_date?sc.q20_date:f.asof), e=Math.min(W-R,x(sc.q80_date)); if(e<=a) return;
    g.fillStyle=`rgba(248,81,73,${.15+.35*(sc.share||0)})`; g.fillRect(a,T,e-a,6+(H-T-B)*0); }));
  g.strokeStyle='#8b949e'; g.lineWidth=1.2; g.beginPath(); ds.forEach((s,i)=>i?g.lineTo(x(s),y(cl[i])):g.moveTo(x(s),y(cl[i]))); g.stroke();
  fr.forEach(f=>{ if(Date.parse(f.asof)<t0) return; const v=Math.max(f.conf?.['6-12m']||0,f.conf?.['12-24m']||0); if(v<=0) return; g.fillStyle='#d29922'; g.fillRect(x(f.asof)-1.5,H-B-8,3,8); });
  ((h&&h.confirmed_tops)||[]).forEach(tp=>{ if(Date.parse(tp.date)<t0) return; const i=ds.indexOf(tp.date); const yy=i>=0?y(cl[i]):T+10; g.fillStyle='#58a6ff'; g.beginPath(); g.moveTo(x(tp.date),yy-4); g.lineTo(x(tp.date)-5,yy-12); g.lineTo(x(tp.date)+5,yy-12); g.fill(); });
}
